<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // Smart Predefined Campus Locations (Clean & Organized)
        const CATEGORY_LOCATIONS = {
            sport: [
                { label: '⚽ 10th Floor · Rooftop Futsal Court', value: '10th Floor · Rooftop Futsal Court' },
                { label: '🏀 B2 · Basketball Court', value: 'B2 · Basketball Court' },
                { label: '🏸 B2 · Badminton Court', value: 'B2 · Badminton Court' },
                { label: '🏓 B2 · Table Tennis (TT) Table', value: 'B2 · Table Tennis (TT) Table' },
                { label: '🏏 B2 · Indoor Cricket Area', value: 'B2 · Indoor Cricket Area' },
                { label: '✏️ Custom / Other Location...', value: 'Custom / Other Location...' }
            ],
            hangout: [
                { label: '☕ Ground Floor · Main Cafeteria', value: 'Ground Floor · Main Cafeteria' },
                { label: '🍱 B1 · Lunch Cafeteria', value: 'B1 · Lunch Cafeteria' },
                { label: '🍕 3rd Floor · One More Bite', value: '3rd Floor · One More Bite' },
                { label: '🥤 10th Floor · Mathi Cafe', value: '10th Floor · Mathi Cafe' },
                { label: '✏️ Custom / Other Location...', value: 'Custom / Other Location...' }
            ],
            project: [
                { label: '📚 3rd Floor · Godawari (Library)', value: '3rd Floor · Godawari (Library)' },
                { label: '🚀 1st Floor · IMPACT Lab', value: '1st Floor · IMPACT Lab' },
                { label: '💻 4th Floor · Computer Lab', value: '4th Floor · Computer Lab' },
                { label: '💡 B2 · Entrepreneurs Point', value: 'B2 · Entrepreneurs Point' },
                { label: '🎓 Ground Floor · ING Skill Academy', value: 'Ground Floor · ING Skill Academy' },
                { label: '🎙️ 5th Floor · LT01 (Lecture Hall)', value: '5th Floor · LT01 (Lecture Hall)' },
                { label: '✏️ Custom / Other Location...', value: 'Custom / Other Location...' }
            ]
        };

        // Campus Hours Only (07:00 AM to 06:00 PM)
        const CAMPUS_HOURS = [
            { hour: '07', ampm: 'AM', display: '07:00 AM' },
            { hour: '08', ampm: 'AM', display: '08:00 AM' },
            { hour: '09', ampm: 'AM', display: '09:00 AM' },
            { hour: '10', ampm: 'AM', display: '10:00 AM' },
            { hour: '11', ampm: 'AM', display: '11:00 AM' },
            { hour: '12', ampm: 'PM', display: '12:00 PM (Noon)' },
            { hour: '01', ampm: 'PM', display: '01:00 PM' },
            { hour: '02', ampm: 'PM', display: '02:00 PM' },
            { hour: '03', ampm: 'PM', display: '03:00 PM' },
            { hour: '04', ampm: 'PM', display: '04:00 PM' },
            { hour: '05', ampm: 'PM', display: '05:00 PM' },
            { hour: '06', ampm: 'PM', display: '06:00 PM' },
        ];

        const get24HourVal = (hourStr, ampmStr) => {
            let hour = parseInt(hourStr);
            const ampm = (ampmStr || '').toUpperCase();
            if (ampm === 'PM' && hour !== 12) hour += 12;
            if (ampm === 'AM' && hour === 12) hour = 0;
            return hour;
        };

        const getMinutesFromMidnight = (hourStr, minuteStr, ampmStr) => {
            const h24 = get24HourVal(hourStr, ampmStr);
            return h24 * 60 + parseInt(minuteStr || '0');
        };

        const convertTo24Hour = (timeStr) => {
            if (!timeStr) return '00:00';
            const match = timeStr.match(/(\d+):(\d+)\s*(AM|PM)/i);
            if (!match) return timeStr;
            let hour = parseInt(match[1]);
            const minute = match[2];
            const ampm = match[3].toUpperCase();
            if (ampm === 'PM' && hour !== 12) hour += 12;
            if (ampm === 'AM' && hour === 12) hour = 0;
            return `${String(hour).padStart(2, '0')}:${minute}`;
        };

        const parseEventDateTime = (dateStr, timeStr) => {
            const time24 = convertTo24Hour(timeStr || '00:00');
            return new Date(`${dateStr}T${time24}`);
        };

        const formatTimeDisplay = (timeStr) => {
            if (!timeStr) return '';
            return timeStr;
        };

        const addRipple = (e) => {
            const btn = e.currentTarget;
            const rect = btn.getBoundingClientRect();
            const circle = document.createElement('span');
            const size = Math.max(rect.width, rect.height);
            circle.style.width = circle.style.height = `${size}px`;
            circle.style.left = `${e.clientX - rect.left - size / 2}px`;
            circle.style.top = `${e.clientY - rect.top - size / 2}px`;
            circle.className = 'ripple';
            btn.appendChild(circle);
            setTimeout(() => circle.remove(), 600);
        };

        const Toasts = ({ toasts }) => (
            <div className="toast-wrap">
                {toasts.map(t => (
                    <div key={t.id} className="toast">
                        <div className="font-semibold text-forest-teal text-xs md:text-sm flex items-center gap-2">
                            <i className={`fas ${t.icon || 'fa-circle-check'} text-electric-gold`}></i>
                            {t.title}
                        </div>
                        {t.message && <div className="text-gray-500 text-xs mt-0.5 font-normal">{t.message}</div>}
                    </div>
                ))}
            </div>
        );

        // AUTH GUARD
        const initialUser = JSON.parse(localStorage.getItem('ing_user') || 'null');
        const userType = localStorage.getItem('ing_user_type');

        if (!initialUser || userType !== 'admin') {
            window.location.href = 'admin-login.html';
        }

        const App = () => {
            const [currentPage, setCurrentPage] = useState('dashboard');
            const [adminUser, setAdminUser] = useState(initialUser);
            const [students, setStudents] = useState([]);
            const [allActivities, setAllActivities] = useState([]);
            const [showCreateModal, setShowCreateModal] = useState(false);
            const [showLogoutConfirm, setShowLogoutConfirm] = useState(false);
            
            // New Activity form state
            const [newActivity, setNewActivity] = useState({
                category: 'sport',
                title: '',
                location: CATEGORY_LOCATIONS.sport[0].value,
                customLocation: '',
                date: '',
                startHour: '07',
                startMinute: '00',
                startAmPm: 'AM',
                endHour: '08',
                endMinute: '00',
                endAmPm: 'AM',
                spots: 4,
                description: ''
            });

            const [formError, setFormError] = useState('');
            const [formSuccess, setFormSuccess] = useState('');
            const [searchQuery, setSearchQuery] = useState('');
            const [editingStudent, setEditingStudent] = useState(null);
            const [showEditModal, setShowEditModal] = useState(false);
            const [showDeleteConfirm, setShowDeleteConfirm] = useState(null);
            const [selectedActivity, setSelectedActivity] = useState(null);
            const [showActivityDetail, setShowActivityDetail] = useState(false);
            const [showCreateStudent, setShowCreateStudent] = useState(false);
            const [newStudent, setNewStudent] = useState({
                name: '',
                studentId: '',
                email: '',
                phone: '',
                dob: '',
                course: '',
                semester: '',
                password: ''
            });

            // Admin Profile State
            const [isEditingProfile, setIsEditingProfile] = useState(false);
            const [profileForm, setProfileForm] = useState({ ...adminUser });
            const [imagePreview, setImagePreview] = useState(adminUser.profileImage || null);
            const [showChangePassword, setShowChangePassword] = useState(false);
            const [passwordData, setPasswordData] = useState({ current: '', new: '', confirm: '' });
            const [passwordError, setPasswordError] = useState('');
            const [passwordSuccess, setPasswordSuccess] = useState('');
            const [showPassword, setShowPassword] = useState(false);

            const [toasts, setToasts] = useState([]);

            const pushToast = useCallback((title, message, icon) => {
                const id = Date.now() + Math.random();
                setToasts(t => [...t, { id, title, message, icon }]);
                setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3200);
            }, []);

            // Handle start/end hour auto-adjustment for campus hours
            const handleStartHourChange = (hour) => {
                const hourObj = CAMPUS_HOURS.find(h => h.hour === hour);
                const autoAmPm = hourObj ? hourObj.ampm : (['01','02','03','04','05','06','12'].includes(hour) ? 'PM' : 'AM');
                const currentIndex = CAMPUS_HOURS.findIndex(h => h.hour === hour);
                const nextHourObj = CAMPUS_HOURS[Math.min(currentIndex + 1, CAMPUS_HOURS.length - 1)];

                setNewActivity(prev => ({ 
                    ...prev, 
                    startHour: hour, 
                    startAmPm: autoAmPm,
                    endHour: nextHourObj ? nextHourObj.hour : hour,
                    endAmPm: nextHourObj ? nextHourObj.ampm : autoAmPm
                }));
            };

            const handleEndHourChange = (hour) => {
                const hourObj = CAMPUS_HOURS.find(h => h.hour === hour);
                const autoAmPm = hourObj ? hourObj.ampm : (['01','02','03','04','05','06','12'].includes(hour) ? 'PM' : 'AM');
                setNewActivity(prev => ({ ...prev, endHour: hour, endAmPm: autoAmPm }));
            };

            const handleCategoryChange = (cat) => {
                const defaultLocObj = CATEGORY_LOCATIONS[cat] ? CATEGORY_LOCATIONS[cat][0] : null;
                setNewActivity(prev => ({
                    ...prev,
                    category: cat,
                    location: defaultLocObj ? defaultLocObj.value : '',
                    customLocation: ''
                }));
            };

            useEffect(() => {
                const loadStudents = () => {
                    firebase.database().ref('users').once('value').then(snapshot => {
                        const data = snapshot.val() || {};
                        const studentList = Object.values(data).filter(u => u.role === 'student');
                        setStudents(studentList);
                    }).catch(err => console.error('Failed to load students:', err));
                };

                const unsubscribe = firebase.auth().onAuthStateChanged((authUser) => {
                    if (authUser) {
                        loadStudents();
                    }
                });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                let activitiesRef = firebase.database().ref('activities');
                activitiesRef.on('value', (snapshot) => {
                    const data = snapshot.val() || {};
                    const items = Object.values(data).map(item => ({
                        ...item,
                        joined: Array.isArray(item.joined) ? item.joined : []
                    }));
                    items.sort((a, b) => b.createdAt - a.createdAt);
                    setAllActivities(items);
                });
                return () => activitiesRef.off();
            }, []);

            const filteredStudents = students.filter(s =>
                s.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
                s.email.toLowerCase().includes(searchQuery.toLowerCase()) ||
                (s.studentId && s.studentId.toLowerCase().includes(searchQuery.toLowerCase()))
            );

            const getAvatarColor = (name) => {
                const colors = ['avatar-blue','avatar-green','avatar-purple','avatar-pink','avatar-orange','avatar-teal'];
                let hash = 0;
                for (let i = 0; i < (name || '').length; i++) {
                    hash = (name || '').charCodeAt(i) + ((hash << 5) - hash);
                }
                return colors[Math.abs(hash) % colors.length];
            };

            const handleCreateActivity = () => {
                setFormError('');

                // Time order validation
                const startMins = getMinutesFromMidnight(newActivity.startHour, newActivity.startMinute, newActivity.startAmPm);
                const endMins = getMinutesFromMidnight(newActivity.endHour, newActivity.endMinute, newActivity.endAmPm);

                if (endMins <= startMins) {
                    setFormError('End time must be later than start time (e.g. 02:00 PM to 04:00 PM)');
                    return;
                }

                const startTime = `${newActivity.startHour}:${newActivity.startMinute} ${newActivity.startAmPm}`;
                const endTime = `${newActivity.endHour}:${newActivity.endMinute} ${newActivity.endAmPm}`;

                const finalLocation = newActivity.location === 'Custom / Other Location...' 
                    ? newActivity.customLocation.trim() 
                    : newActivity.location;

                if (!newActivity.title || !finalLocation || !newActivity.date) {
                    setFormError('Please fill in all required fields.');
                    return;
                }

                const currentUser = firebase.auth().currentUser;
                const myId = (currentUser && currentUser.uid) || adminUser.id || 'admin_1';

                const activityId = 'p_' + Date.now();
                const activity = {
                    id: activityId,
                    category: newActivity.category,
                    title: newActivity.title,
                    location: finalLocation,
                    description: newActivity.description,
                    date: newActivity.date,
                    startTime: startTime,
                    endTime: endTime,
                    spots: newActivity.spots,
                    posterId: myId,
                    posterName: adminUser?.name || 'Admin',
                    joined: [{ id: myId, name: adminUser?.name || 'Admin' }],
                    createdAt: Date.now()
                };

                firebase.database().ref('activities/' + activityId).set(activity)
                    .then(() => {
                        setNewActivity({
                            category: 'sport',
                            title: '',
                            location: CATEGORY_LOCATIONS.sport[0].value,
                            customLocation: '',
                            date: '',
                            startHour: '07',
                            startMinute: '00',
                            startAmPm: 'AM',
                            endHour: '08',
                            endMinute: '00',
                            endAmPm: 'AM',
                            spots: 4,
                            description: ''
                        });
                        setShowCreateModal(false);
                        pushToast('Activity Published', `"${activity.title}" is now active.`, 'fa-calendar-check');

                        // Notify students
                        firebase.database().ref('users').once('value').then(snapshot => {
                            const data = snapshot.val() || {};
                            Object.entries(data).forEach(([uid, u]) => {
                                if (u.role === 'student' && uid !== myId) {
                                    const notifId = 'n_' + Date.now() + '_' + Math.random().toString(36).slice(2);
                                    const notif = {
                                        id: notifId,
                                        userId: uid,
                                        postId: activity.id,
                                        type: 'new_activity',
                                        message: `📢 New Campus Activity: "${activity.title}". Tap to view details.`,
                                        read: false,
                                        createdAt: Date.now()
                                    };
                                    firebase.database().ref('notifications/' + notifId).set(notif);
                                }
                            });
                        });
                    })
                    .catch(err => {
                        console.error('Failed to create activity:', err);
                        setFormError('Failed to create activity: ' + err.message);
                    });
            };

            const handleCreateStudent = async () => {
                setFormError('');

                if (!newStudent.name || !newStudent.email || !newStudent.password) {
                    setFormError('Please fill in name, email, and password.');
                    return;
                }
                if (newStudent.password.length < 8) {
                    setFormError('Password must be at least 8 characters long.');
                    return;
                }

                try {
                    const secondaryApp = firebase.initializeApp(firebaseConfig, "Secondary_" + Date.now());
                    const secondaryAuth = secondaryApp.auth();

                    const userCred = await secondaryAuth.createUserWithEmailAndPassword(newStudent.email, newStudent.password);
                    const newUid = userCred.user.uid;

                    const student = {
                        id: newUid,
                        name: newStudent.name,
                        email: newStudent.email,
                        role: 'student',
                        studentId: newStudent.studentId || 'STU' + String(Date.now()).slice(-6),
                        phone: newStudent.phone || '',
                        dob: newStudent.dob || '',
                        course: newStudent.course || '',
                        semester: newStudent.semester || '',
                        createdAt: new Date().toISOString().split('T')[0]
                    };

                    await firebase.database().ref('users/' + newUid).set(student);
                    await secondaryAuth.signOut();
                    await secondaryApp.delete();

                    setStudents([...students, student]);
                    setNewStudent({ name: '', studentId: '', email: '', phone: '', dob: '', course: '', semester: '', password: '' });
                    setShowCreateStudent(false);
                    pushToast('Student Added', `Account created for ${student.name}`, 'fa-user-check');

                } catch (err) {
                    console.error(err);
                    setFormError(err.message);
                }
            };

            const handleEditStudent = (student) => {
                setEditingStudent({ ...student });
                setShowEditModal(true);
            };

            const saveEditStudent = () => {
                if (!editingStudent.name || !editingStudent.email) {
                    setFormError('Name and email are required.');
                    return;
                }
                firebase.database().ref('users/' + editingStudent.id).update({
                    name: editingStudent.name,
                    email: editingStudent.email,
                    phone: editingStudent.phone || '',
                    course: editingStudent.course || '',
                    semester: editingStudent.semester || ''
                }).then(() => {
                    setStudents(students.map(s => s.id === editingStudent.id ? { ...editingStudent } : s));
                    setShowEditModal(false);
                    setEditingStudent(null);
                    pushToast('Student Updated', 'Changes saved successfully.', 'fa-user-check');
                }).catch(err => {
                    console.error(err);
                    setFormError(err.message);
                });

                firebase.database().ref('users/' + studentId).remove().then(() => {
                    setStudents(students.filter(s => s.id !== studentId));
                    setShowDeleteConfirm(null);
                    pushToast('Student Deleted', 'User profile removed.', 'fa-trash-can');
                }).catch(err => alert('Failed to delete: ' + err.message));
            };

            const resetStudentPassword = (studentId) => {
                const student = students.find(s => s.id === studentId);
                if (!student) return;
                firebase.auth().sendPasswordResetEmail(student.email).then(() => {
                    pushToast('Reset Email Sent', `Password reset sent to ${student.email}`, 'fa-envelope');
                }).catch(err => alert('Failed to send reset email: ' + err.message));
            };

            const deleteActivity = (activityId) => {
                if (confirm('Are you sure you want to delete this activity?')) {
                    firebase.database().ref('activities/' + activityId).remove()
                        .then(() => pushToast('Activity Deleted', null, 'fa-trash-can'));
                }
            };

            const resetAllData = () => {
                if (confirm('⚠️ WARNING: This will clear local session storage. Continue?')) {
                    localStorage.removeItem('ing_user');
                    localStorage.removeItem('ing_user_type');
                    window.location.href = '../index.html';
                }
            };

            // Admin Profile Update
            const updateAdminProfile = () => {
                const myId = (firebase.auth().currentUser && firebase.auth().currentUser.uid) || adminUser.id;
                firebase.database().ref('users/' + myId).update({
                    name: profileForm.name,
                    phone: profileForm.phone || '',
                    department: profileForm.department || '',
                    profileImage: profileForm.profileImage || null
                }).then(() => {
                    const updated = { ...adminUser, ...profileForm };
                    setAdminUser(updated);
                    localStorage.setItem('ing_user', JSON.stringify(updated));
                    pushToast('Profile Saved', 'Your admin details were updated.', 'fa-user-check');
                    setIsEditingProfile(false);
                }).catch(err => alert('Failed to update profile: ' + err.message));
            };

            const handleAdminImageUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                if (file.size > 5 * 1024 * 1024) {
                    alert('Image size should be less than 5MB.');
                    return;
                }
                const reader = new FileReader();
                reader.onloadend = () => {
                    setImagePreview(reader.result);
                    setProfileForm({ ...profileForm, profileImage: reader.result });
                };
                reader.readAsDataURL(file);
            };

            const removeAdminImage = () => {
                setImagePreview(null);
                setProfileForm({ ...profileForm, profileImage: null });
            };

            const changeAdminPassword = () => {
                if (passwordData.new.length < 8) {
                    setPasswordError('New password must be at least 8 characters long.');
                    return;
                }
                if (passwordData.new !== passwordData.confirm) {
                    setPasswordError('New passwords do not match.');
                    return;
                }
                const currentUser = firebase.auth().currentUser;
                if (currentUser) {
                    currentUser.updatePassword(passwordData.new).then(() => {
                        setPasswordSuccess('Password updated successfully!');
                        setPasswordError('');
                        setPasswordData({ current: '', new: '', confirm: '' });
                        setTimeout(() => setShowChangePassword(false), 2000);
                    }).catch(err => setPasswordError(err.message));
                }
            };

                const eventDate = parseEventDateTime(activity.date, activity.startTime);
                const now = new Date();
                if (eventDate < now) return 'Past';
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                const postDate = new Date(activity.date);
                postDate.setHours(0, 0, 0, 0);
                if (postDate.getTime() === today.getTime()) return 'Today';
                return 'Upcoming';
            };

                    'Upcoming': 'status-upcoming font-medium',

                                        <p className="text-xs font-semibold text-gray-400 uppercase tracking-wider">Total Students</p>

                                    </div>
                                </div>
                            </div>

                                    <tbody>
                                        {filteredStudents.map(s => {

                                                <tr key={s.id} className="border-b border-gray-100 table-row">
                                                    <td className="py-3">
                                                        <div className="flex items-center gap-2.5">
                                                            <div className={`avatar-sm ${avatarClass}`}>
                                                                {(s.name || 'S').charAt(0).toUpperCase()}

            const renderProfile = () => {

                                    {imagePreview ? (

                                    <h3 className="text-xl font-bold text-gray-800">{adminUser.name || 'Administrator'}</h3>

                            <div className="flex gap-2 mb-6">

                                <span className="text-base md:text-lg font-bold tracking-tight hidden sm:block">👔 Admin Dashboard</span>
                            </div>
                            <div className="flex items-center gap-3.5">
                                <span className="text-xs text-blue-200 font-medium hidden md:inline">👤 {adminUser?.name || 'Admin'}</span>
                                <button onClick={() => setShowLogoutConfirm(true)} className="text-xs text-white/60 hover:text-white transition" title="Logout">
                                    <i className="fas fa-right-from-bracket"></i>
                                </button>
                            </div>
                        </div>
                    </header>

                    <nav className="bg-white border-b border-gray-200 sticky top-15 z-20 shadow-xs">
                        <div className="max-w-7xl mx-auto px-4 py-1.5 flex flex-wrap gap-2">
                            <button onClick={() => setCurrentPage('dashboard')} className={`nav-link px-3.5 py-1.5 rounded-lg text-xs md:text-sm font-medium transition ${currentPage === 'dashboard' ? 'active text-forest-teal bg-teal-50' : 'text-gray-600 hover:bg-gray-50'}`}>
                                <i className="fas fa-home mr-1.5 text-xs"></i> Dashboard
                            </button>
                            <button onClick={() => setCurrentPage('activities')} className={`nav-link px-3.5 py-1.5 rounded-lg text-xs md:text-sm font-medium transition ${currentPage === 'activities' ? 'active text-forest-teal bg-teal-50' : 'text-gray-600 hover:bg-gray-50'}`}>
                                <i className="fas fa-calendar-alt mr-1.5 text-xs"></i> Activities
                            </button>
                            <button onClick={() => setCurrentPage('students')} className={`nav-link px-3.5 py-1.5 rounded-lg text-xs md:text-sm font-medium transition ${currentPage === 'students' ? 'active text-forest-teal bg-teal-50' : 'text-gray-600 hover:bg-gray-50'}`}>
                                <i className="fas fa-users mr-1.5 text-xs"></i> Students
                            </button>
                            <button onClick={() => setCurrentPage('profile')} className={`nav-link px-3.5 py-1.5 rounded-lg text-xs md:text-sm font-medium transition ${currentPage === 'profile' ? 'active text-forest-teal bg-teal-50' : 'text-gray-600 hover:bg-gray-50'}`}>
                                <i className="fas fa-user mr-1.5 text-xs"></i> Profile
                            </button>
                            <a href="../index.html" className="nav-link px-3.5 py-1.5 rounded-lg text-xs md:text-sm font-medium text-gray-600 hover:bg-gray-50 transition">
                                <i className="fas fa-globe mr-1.5 text-xs"></i> Home Page
                            </a>
                        </div>
                    </nav>

                    <div className="max-w-7xl mx-auto px-4 py-5">
                        {currentPage === 'dashboard' && renderDashboard()}
                        {currentPage === 'activities' && renderActivities()}
                        {currentPage === 'students' && renderStudents()}
                        {currentPage === 'profile' && renderProfile()}
                    </div>

                    {/* Classy Subtle Blurred Footer CTA Banner */}
                    <div className="footer__cta mt-10">
                        <div className="art__animation">
                            <img src="https://ing.edu.np/images/art-animation.png" alt="" className="art__animation-img" />
                        </div>
                        <div className="max-w-6xl mx-auto px-4 text-center relative z-10">
                            <p className="text-xs text-blue-200/80 font-normal">
                                © 2026 ING College of Innovation and Leadership. All Rights Reserved.
                            </p>
                        </div>
                    </div>

                    {/* CREATE ACTIVITY MODAL WITH CLEAN LOCATION SELECT & LOCKED SCHOOL HOURS */}
                    {showCreateModal && (
                        <div className="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4" onClick={() => setShowCreateModal(false)}>
                            <div className="bg-white rounded-2xl max-w-lg w-full max-h-[90vh] overflow-y-auto p-5 md:p-6 shadow-xl create-activity-modal" onClick={e => e.stopPropagation()}>
                                <div className="flex items-center justify-between mb-4 border-b border-gray-100 pb-3">
                                    <h3 className="text-lg font-bold text-gray-800">📝 Create Activity</h3>
                                    <button onClick={() => setShowCreateModal(false)} className="text-gray-400 hover:text-gray-600 text-xl">&times;</button>
                                </div>
                                <div className="space-y-4">
                                    <div>
                                        <label className="block text-[11px] font-semibold text-gray-500 uppercase tracking-wider mb-1.5">Category</label>
                                        <div className="flex gap-2">
                                            {['sport', 'project', 'hangout'].map(cat => (
                                                <button key={cat} onClick={() => handleCategoryChange(cat)}
                                                    className={`px-4 py-1.5 rounded-full text-xs font-medium transition-all ${newActivity.category === cat ? 'bg-forest-teal text-white font-semibold shadow-xs' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}`}>
                                                    {cat.charAt(0).toUpperCase() + cat.slice(1)}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-[11px] font-semibold text-gray-500 uppercase tracking-wider mb-1">Title *</label>
                                        <input type="text" value={newActivity.title} onChange={e => setNewActivity({...newActivity, title: e.target.value})}
                                            className="w-full px-3.5 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#0D5C53] focus:border-transparent transition text-xs md:text-sm font-normal" placeholder="e.g. Official Futsal Tournament" />
                                    </div>

                                    <div className="bg-gray-50/80 p-3.5 rounded-xl border border-gray-200/80 space-y-2">
                                        <div className="flex items-center justify-between">
                                            <label className="block text-[11px] font-semibold text-forest-teal uppercase tracking-wider">
                                                <i className="fas fa-location-dot text-electric-gold mr-1"></i> Campus Location *
                                            </label>
                                            <span className="text-[10px] text-gray-400 font-normal">Pre-filtered for {newActivity.category}</span>
                                        </div>
                                        <select 
                                            value={newActivity.location} 
                                            onChange={e => setNewActivity({...newActivity, location: e.target.value})}
                                            className="w-full px-3.5 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#0D5C53] focus:border-transparent transition text-xs md:text-sm bg-white font-normal text-gray-800"
                                        >
                                            {(CATEGORY_LOCATIONS[newActivity.category] || CATEGORY_LOCATIONS.sport).map((locObj, idx) => (
                                                <option key={idx} value={locObj.value}>{locObj.label}</option>
                                            ))}
                                        </select>
                                        {newActivity.location === 'Custom / Other Location...' && (
                                            <input 
                                                type="text" 
                                                value={newActivity.customLocation} 
                                                onChange={e => setNewActivity({...newActivity, customLocation: e.target.value})}
                                                className="w-full mt-2 px-3.5 py-2 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#0D5C53] focus:border-transparent transition text-xs md:text-sm font-normal bg-white" 
                                                placeholder="Type custom location name..." 
                                            />
                                        )}
                                    </div>

                                    <div>
                                        <label className="block text-[11px] font-semibold text-gray-500 uppercase tracking-wider mb-1">Description</label>
                                        <textarea value={newActivity.description} onChange={e => setNewActivity({...newActivity, description: e.target.value})}
                                            className="w-full px-3.5 py-2 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#0D5C53] focus:border-transparent transition text-xs md:text-sm font-normal" rows="2" placeholder="Activity details..." />
                                    </div>

                                    <div>
                                        <label className="block text-[11px] font-semibold text-gray-500 uppercase tracking-wider mb-1">Date *</label>
                                        <input type="date" value={newActivity.date} onChange={e => setNewActivity({...newActivity, date: e.target.value})}
                                            min={new Date().toISOString().split('T')[0]}
                                            className="w-full px-3.5 py-2 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#0D5C53] focus:border-transparent transition text-xs md:text-sm font-normal" />
                                    </div>

                                    <div className="bg-gray-50/80 p-3.5 rounded-xl border border-gray-200/80 space-y-2.5">
                                        <div className="flex items-center justify-between">
                                            <label className="block text-[11px] font-semibold text-forest-teal uppercase tracking-wider">
                                                <i className="fas fa-clock text-electric-gold mr-1"></i> Time (Campus Hours: 7 AM - 6 PM)
                                            </label>
                                        </div>
                                        <div className="grid grid-cols-2 gap-3">
                                            <div>
                                                <label className="block text-[10px] font-medium text-gray-400 uppercase mb-1">Start Time</label>
                                                <div className="flex gap-1 items-center">
                                                    <select value={newActivity.startHour} onChange={e => handleStartHourChange(e.target.value)} className="time-select flex-1 text-xs bg-white font-medium">
                                                        {CAMPUS_HOURS.map(h => (
                                                            <option key={h.hour} value={h.hour}>{h.display}</option>
                                                        ))}
                                                    </select>
                                                    <select value={newActivity.startMinute} onChange={e => setNewActivity({...newActivity, startMinute: e.target.value})} className="time-select text-xs bg-white">
                                                        {['00','15','30','45'].map(m => (
                                                            <option key={m} value={m}>:{m}</option>
                                                        ))}
                                                    </select>
                                                </div>
                                            </div>

                                            <div>
                                                <label className="block text-[10px] font-medium text-gray-400 uppercase mb-1">End Time</label>
                                                <div className="flex gap-1 items-center">
                                                    <select value={newActivity.endHour} onChange={e => handleEndHourChange(e.target.value)} className="time-select flex-1 text-xs bg-white font-medium">
                                                        {CAMPUS_HOURS.map(h => (
                                                            <option key={h.hour} value={h.hour}>{h.display}</option>
                                                        ))}
                                                    </select>
                                                    <select value={newActivity.endMinute} onChange={e => setNewActivity({...newActivity, endMinute: e.target.value})} className="time-select text-xs bg-white">
                                                        {['00','15','30','45'].map(m => (
                                                            <option key={m} value={m}>:{m}</option>
                                                        ))}
                                                    </select>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-[11px] font-semibold text-gray-500 uppercase tracking-wider mb-1">Spots (including poster)</label>
                                        <input type="number" min="2" max="30" value={newActivity.spots} onChange={e => setNewActivity({...newActivity, spots: parseInt(e.target.value) || 4})}
                                            className="w-full px-3.5 py-2 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#0D5C53] focus:border-transparent transition text-xs md:text-sm font-normal" />
                                    </div>

                                    {formError && <div className="text-red-600 text-xs bg-red-50 border border-red-200 rounded-xl px-3 py-1.5 font-normal">{formError}</div>}

                                    <button onClick={handleCreateActivity} className="btn-gold w-full py-2.5 rounded-xl font-semibold text-xs shadow-xs mt-2 text-forest-teal">
                                        Publish Activity
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ACTIVITY DETAIL MODAL */}
                    {showActivityDetail && selectedActivity && (
                        <div className="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4" onClick={() => setShowActivityDetail(false)}>
                            <div className="bg-white rounded-2xl max-w-xl w-full max-h-[90vh] overflow-y-auto p-5 shadow-xl" onClick={e => e.stopPropagation()}>
                                <div className="flex items-start justify-between mb-3.5">
                                    <div>
                                        <span className={`text-[11px] font-medium px-2.5 py-0.5 rounded-md ${selectedActivity.category === 'sport' ? 'tag-sport' : selectedActivity.category === 'project' ? 'tag-project' : 'tag-hangout'}`}>{selectedActivity.category}</span>
                                        <h3 className="text-lg font-bold text-gray-800 mt-1">{selectedActivity.title}</h3>
                                    </div>
                                    <button onClick={() => setShowActivityDetail(false)} className="text-gray-400 hover:text-gray-600 text-xl">&times;</button>
                                </div>
                                <div className="space-y-3.5">
                                    <div className="flex flex-wrap gap-3 text-xs text-gray-600 bg-gray-50/80 p-3 rounded-xl border border-gray-100 font-normal">
                                        <span><i className="fas fa-calendar text-electric-gold mr-1.5"></i>{selectedActivity.date}</span>
                                        <span><i className="fas fa-clock text-electric-gold mr-1.5"></i>{formatTimeDisplay(selectedActivity.startTime)} - {formatTimeDisplay(selectedActivity.endTime)}</span>
                                        <span><i className="fas fa-map-marker-alt text-electric-gold mr-1.5"></i>{selectedActivity.location}</span>
                                    </div>
                                    {selectedActivity.description && (
                                        <div className="bg-teal-50/40 p-3.5 rounded-xl border border-teal-100/80 text-xs md:text-sm text-gray-700 leading-relaxed font-normal">
                                            {selectedActivity.description}
                                        </div>
                                    )}
                                    <div className="flex items-center gap-3">
                                        <span className="text-xs font-semibold text-gray-600">👥 {selectedActivity.joined?.length || 0}/{selectedActivity.spots || 4} spots filled</span>
                                        <span className="text-xs text-gray-400 font-normal">Organized by {selectedActivity.posterName}</span>
                                    </div>
                                    <div className="flex gap-2.5 pt-2">
                                        <button onClick={() => { setShowActivityDetail(false); deleteActivity(selectedActivity.id); }} className="btn-danger flex-1 py-2 rounded-xl font-medium text-xs">
                                            Delete Activity
                                        </button>
                                        <button onClick={() => setShowActivityDetail(false)} className="flex-1 border border-gray-200 py-2 rounded-xl text-xs font-medium text-gray-600 hover:bg-gray-50 transition">Close</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* CREATE STUDENT MODAL */}
                    {showCreateStudent && (
                        <div className="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4" onClick={() => setShowCreateStudent(false)}>
                            <div className="bg-white rounded-2xl max-w-md w-full max-h-[90vh] overflow-y-auto p-5 shadow-xl" onClick={e => e.stopPropagation()}>
                                <div className="flex items-center justify-between mb-3.5">
                                    <h3 className="text-lg font-bold text-gray-800">Create Student Account</h3>
                                    <button onClick={() => setShowCreateStudent(false)} className="text-gray-400 hover:text-gray-600 text-xl">&times;</button>
                                </div>
                                {formError && <div className="text-red-600 text-xs bg-red-50 border border-red-200 rounded-xl px-3 py-1.5 mb-3 font-normal">{formError}</div>}
                                <div className="space-y-3 text-xs md:text-sm font-normal">
                                    <div>
                                        <label className="block text-[11px] font-semibold text-gray-500 uppercase">Full Name *</label>
                                        <input type="text" value={newStudent.name} onChange={e => setNewStudent({...newStudent, name: e.target.value})}
                                            className="w-full mt-1 px-3.5 py-2 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#0D5C53] focus:border-transparent transition" />
                                    </div>
                                    <div>
                                        <label className="block text-[11px] font-semibold text-gray-500 uppercase">Student ID</label>
                                        <input type="text" value={newStudent.studentId} onChange={e => setNewStudent({...newStudent, studentId: e.target.value})}
                                            className="w-full mt-1 px-3.5 py-2 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#0D5C53] focus:border-transparent transition" placeholder="e.g. STU133718" />
                                    </div>
                                    <div>
                                        <label className="block text-[11px] font-semibold text-gray-500 uppercase">Email *</label>
                                        <input type="email" value={newStudent.email} onChange={e => setNewStudent({...newStudent, email: e.target.value})}
                                            className="w-full mt-1 px-3.5 py-2 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#0D5C53] focus:border-transparent transition" placeholder="student@ing.edu.np" />
                                    </div>
                                    <div>
                                        <label className="block text-[11px] font-semibold text-gray-500 uppercase">Course/Program</label>
                                        <input type="text" value={newStudent.course} onChange={e => setNewStudent({...newStudent, course: e.target.value})}
                                            className="w-full mt-1 px-3.5 py-2 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#0D5C53] focus:border-transparent transition" placeholder="e.g. BSc (Hons) Computing" />
                                    </div>
                                    <div>
                                        <label className="block text-[11px] font-semibold text-gray-500 uppercase">Password * (min 8 chars)</label>
                                        <input type="password" value={newStudent.password} onChange={e => setNewStudent({...newStudent, password: e.target.value})}
                                            className="w-full mt-1 px-3.5 py-2 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#0D5C53] focus:border-transparent transition" />
                                    </div>
                                    <button onClick={handleCreateStudent} className="btn-forest w-full py-2.5 rounded-xl font-semibold text-xs mt-2">
                                        Create Account
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* EDIT STUDENT MODAL */}
                    {showEditModal && editingStudent && (
                        <div className="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4" onClick={() => setShowEditModal(false)}>
                            <div className="bg-white rounded-2xl max-w-md w-full p-5 shadow-xl" onClick={e => e.stopPropagation()}>
                                <div className="flex items-center justify-between mb-3.5">
                                    <h3 className="text-lg font-bold text-gray-800">Edit Student</h3>
                                    <button onClick={() => setShowEditModal(false)} className="text-gray-400 hover:text-gray-600 text-xl">&times;</button>
                                </div>
                                <div className="space-y-3 text-xs md:text-sm font-normal">
                                    <div>
                                        <label className="block text-[11px] font-semibold text-gray-500 uppercase">Full Name</label>
                                        <input type="text" value={editingStudent.name} onChange={e => setEditingStudent({...editingStudent, name: e.target.value})}
                                            className="w-full mt-1 px-3.5 py-2 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#0D5C53] focus:border-transparent transition" />
                                    </div>
                                    <div>
                                        <label className="block text-[11px] font-semibold text-gray-500 uppercase">Email</label>
                                        <input type="email" value={editingStudent.email} onChange={e => setEditingStudent({...editingStudent, email: e.target.value})}
                                            className="w-full mt-1 px-3.5 py-2 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#0D5C53] focus:border-transparent transition" />
                                    </div>
                                    <div>
                                        <label className="block text-[11px] font-semibold text-gray-500 uppercase">Course</label>
                                        <input type="text" value={editingStudent.course || ''} onChange={e => setEditingStudent({...editingStudent, course: e.target.value})}
                                            className="w-full mt-1 px-3.5 py-2 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#0D5C53] focus:border-transparent transition" />
                                    </div>
                                    <button onClick={saveEditStudent} className="btn-forest w-full py-2.5 rounded-xl font-semibold text-xs mt-2">
                                        Save Changes
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* DELETE CONFIRMATION MODAL */}
                    {showDeleteConfirm && (
                        <div className="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4" onClick={() => setShowDeleteConfirm(null)}>
                            <div className="bg-white rounded-2xl max-w-sm w-full p-5 shadow-xl text-center" onClick={e => e.stopPropagation()}>
                                <div className="w-12 h-12 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-2 text-red-600 text-xl">
                                    <i className="fas fa-exclamation-triangle"></i>
                                </div>
                                <h3 className="text-base font-bold text-gray-800">Delete Student?</h3>
                                <p className="text-xs text-gray-500 mt-1 font-normal">Are you sure you want to delete this student account? This action cannot be undone.</p>
                                <div className="flex gap-2.5 mt-4">
                                    <button onClick={() => setShowDeleteConfirm(null)} className="flex-1 py-2 border border-gray-200 rounded-xl text-gray-600 hover:bg-gray-50 transition text-xs font-medium">Cancel</button>
                                    <button onClick={() => handleDeleteStudent(showDeleteConfirm)} className="flex-1 btn-danger py-2 rounded-xl font-medium text-xs">Delete</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* CHANGE PASSWORD MODAL */}
                    {showChangePassword && (
                        <div className="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4" onClick={() => setShowChangePassword(false)}>
                            <div className="bg-white rounded-2xl max-w-md w-full p-5 shadow-xl" onClick={e => e.stopPropagation()}>
                                <div className="flex items-center justify-between mb-3">
                                    <h3 className="text-base font-bold text-gray-800">Change Admin Password</h3>
                                    <button onClick={() => setShowChangePassword(false)} className="text-gray-400 hover:text-gray-600 text-xl">&times;</button>
                                </div>
                                {passwordSuccess && <div className="bg-green-50 border border-green-200 text-green-700 px-3 py-1.5 rounded-lg mb-3 text-xs font-medium">{passwordSuccess}</div>}
                                {passwordError && <div className="text-red-600 text-xs mb-3 font-normal">{passwordError}</div>}
                                <div className="space-y-3">
                                    <div>
                                        <label className="block text-[11px] font-semibold text-gray-500 uppercase">New Password (min 8 chars)</label>
                                        <input type={showPassword ? 'text' : 'password'} value={passwordData.new} onChange={e => setPasswordData({...passwordData, new: e.target.value})}
                                            className="w-full mt-1 px-3.5 py-2 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#0D5C53] focus:border-transparent transition text-xs md:text-sm font-normal" />
                                    </div>
                                    <div>
                                        <label className="block text-[11px] font-semibold text-gray-500 uppercase">Confirm New Password</label>
                                        <input type={showPassword ? 'text' : 'password'} value={passwordData.confirm} onChange={e => setPasswordData({...passwordData, confirm: e.target.value})}
                                            className="w-full mt-1 px-3.5 py-2 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#0D5C53] focus:border-transparent transition text-xs md:text-sm font-normal" />
                                    </div>
                                    <div className="flex items-center gap-2">
                                        <input type="checkbox" id="showPwdAdmin" checked={showPassword} onChange={() => setShowPassword(!showPassword)} className="w-3.5 h-3.5 rounded text-forest-teal focus:ring-0" />
                                        <label htmlFor="showPwdAdmin" className="text-xs font-normal text-gray-600">Show Password</label>
                                    </div>
                                    <button onClick={changeAdminPassword} className="btn-forest w-full py-2.5 rounded-xl font-semibold text-xs mt-1">
                                        Update Password
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* LOGOUT CONFIRMATION MODAL */}
                    {showLogoutConfirm && (
                        <div className="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4" onClick={() => setShowLogoutConfirm(false)}>
                            <div className="bg-white rounded-2xl max-w-sm w-full p-5 shadow-xl text-center" onClick={e => e.stopPropagation()}>
                                <div className="w-12 h-12 bg-amber-100 rounded-full flex items-center justify-center mx-auto mb-2 text-amber-600 text-xl">
                                    <i className="fas fa-right-from-bracket"></i>
                                </div>
                                <h2 className="text-base font-bold text-gray-800">Log Out?</h2>
                                <p className="text-xs text-gray-500 mt-0.5 font-normal">Are you sure you want to sign out of the Admin Dashboard?</p>
                                <div className="flex gap-2.5 mt-4">
                                    <button onClick={() => setShowLogoutConfirm(false)} className="flex-1 py-2 border border-gray-200 rounded-xl text-gray-600 hover:bg-gray-50 transition text-xs font-medium">Cancel</button>
                                    <button onClick={() => { localStorage.removeItem('ing_user'); localStorage.removeItem('ing_user_type'); firebase.auth().signOut(); window.location.href = 'admin-login.html'; }} className="flex-1 btn-danger py-2 rounded-xl font-medium text-xs">Log Out</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>

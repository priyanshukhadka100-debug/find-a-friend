<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        const user = JSON.parse(localStorage.getItem('ing_user') || 'null');
        const userType = localStorage.getItem('ing_user_type');

        if (!user || userType !== 'admin') {
            window.location.href = 'admin-login.html';
        }

        if (!localStorage.getItem('ing_admins')) {
            const defaultAdmins = [
                { id: 'admin_1', name: 'Super Admin', email: 'admin@ing.edu.np', password: 'admin1234', type: 'admin', role: 'Super Admin' }
            ];
            localStorage.setItem('ing_admins', JSON.stringify(defaultAdmins));
        }

        // ========== HELPER: parse date + 12-hour time ==========
        const parseEventDateTime = (dateStr, timeStr) => {
            if (!dateStr) return new Date(0);
            if (!timeStr) return new Date(dateStr + 'T00:00:00');
            const match = timeStr.match(/(\d+):(\d+)\s*(AM|PM)/);
            if (match) {
                let hour = parseInt(match[1]);
                const minute = match[2];
                const ampm = match[3];
                if (ampm === 'PM' && hour !== 12) hour += 12;
                if (ampm === 'AM' && hour === 12) hour = 0;
                const date = new Date(dateStr);
                date.setHours(hour, parseInt(minute), 0, 0);
                return date;
            }
            return new Date(dateStr + 'T' + timeStr);
        };

        const formatTimeDisplay = (timeStr) => {
            if (!timeStr) return '';
            return timeStr;
        };

        const App = () => {
            const [currentPage, setCurrentPage] = useState('dashboard');
            const [students, setStudents] = useState([]);

            useEffect(() => {
                const loadStudents = (attempt) => {
                    firebase.database().ref('users').once('value').then(snapshot => {
                        const data = snapshot.val() || {};
                        const studentList = Object.values(data).filter(u => u.role === 'student');
                        setStudents(studentList);
                    }).catch(err => {
                        console.error('Failed to load students (attempt ' + attempt + '):', err);
                        if (attempt < 3) {
                            setTimeout(() => loadStudents(attempt + 1), 800);
                        }
                    });
                };

                const unsubscribe = firebase.auth().onAuthStateChanged((authUser) => {
                    if (authUser) {
                        loadStudents(1);
                    }
                });
                return () => unsubscribe();
            }, []);

            const [admins, setAdmins] = useState(() => JSON.parse(localStorage.getItem('ing_admins') || '[]'));
            const [allActivities, setAllActivities] = useState([]);

            useEffect(() => {
                let activitiesRef = null;

                const attachListener = (attempt) => {
                    activitiesRef = firebase.database().ref('activities');
                    activitiesRef.on('value', (snapshot) => {
                        const data = snapshot.val() || {};
                        const items = Object.values(data).map(item => ({
                            ...item,
                            joined: Array.isArray(item.joined) ? item.joined : []
                        }));
                        items.sort((a, b) => b.createdAt - a.createdAt);
                        setAllActivities(items);
                    }, (err) => {
                        console.error('Activities listener error (attempt ' + attempt + '):', err);
                        if (attempt < 3) {
                            if (activitiesRef) activitiesRef.off();
                            setTimeout(() => attachListener(attempt + 1), 800);
                        }
                    });
                };

                const unsubscribeAuth = firebase.auth().onAuthStateChanged((authUser) => {
                    if (authUser && !activitiesRef) {
                        attachListener(1);
                    }
                });

                return () => {
                    unsubscribeAuth();
                    if (activitiesRef) activitiesRef.off();
                };
            }, []);

            const [showCreateModal, setShowCreateModal] = useState(false);
            const [showLogoutConfirm, setShowLogoutConfirm] = useState(false);
            const [newActivity, setNewActivity] = useState({
                category: 'sport',
                title: '',
                location: '',
                date: '',
                startHour: '07',
                startMinute: '00',
                startAmPm: 'AM',
                endHour: '08',
                endMinute: '00',
                endAmPm: 'AM',
                spots: 4,
                description: ''
            });
            const [formError, setFormError] = useState('');
            const [formSuccess, setFormSuccess] = useState('');
            const [searchQuery, setSearchQuery] = useState('');
            const [editingStudent, setEditingStudent] = useState(null);
            const [showEditModal, setShowEditModal] = useState(false);
            const [showDeleteConfirm, setShowDeleteConfirm] = useState(null);
            const [selectedActivity, setSelectedActivity] = useState(null);
            const [showActivityDetail, setShowActivityDetail] = useState(false);

            useEffect(() => {
                localStorage.setItem('ing_admins', JSON.stringify(admins));
            }, [admins]);

            const filteredStudents = students.filter(s =>
                s.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
                s.email.toLowerCase().includes(searchQuery.toLowerCase()) ||
                (s.studentId && s.studentId.toLowerCase().includes(searchQuery.toLowerCase()))
            );

            const getAvatarColor = (name) => {
                const colors = ['avatar-blue','avatar-green','avatar-purple','avatar-pink','avatar-orange','avatar-teal','avatar-indigo','avatar-rose','avatar-amber','avatar-emerald'];
                let hash = 0;
                for (let i = 0; i < name.length; i++) {
                    hash = name.charCodeAt(i) + ((hash << 5) - hash);
                }
                return colors[Math.abs(hash) % colors.length];
            };

            const [newStudent, setNewStudent] = useState({
                name: '',
                studentId: '',
                email: '',
                phone: '',
                dob: '',
                course: '',
                semester: '',
                password: ''
            });
            const [showCreateStudent, setShowCreateStudent] = useState(false);

            // ========== FIXED: handleCreateActivity ==========
            const handleCreateActivity = () => {
                setFormError('');
                setFormSuccess('');

                const startTime = `${newActivity.startHour}:${newActivity.startMinute} ${newActivity.startAmPm}`;
                const endTime = `${newActivity.endHour}:${newActivity.endMinute} ${newActivity.endAmPm}`;

                if (!newActivity.title || !newActivity.location || !newActivity.date) {
                    setFormError('Please fill in all required fields.');
                    return;
                }

                // Use localStorage admin instead of Firebase Auth
                const adminUser = JSON.parse(localStorage.getItem('ing_user') || 'null');
                if (!adminUser || adminUser.type !== 'admin') {
                    setFormError('You are not logged in as an admin. Please log out and log back in.');
                    return;
                }

                const activityId = 'p_' + Date.now();
                const activity = {
                    id: activityId,
                    ...newActivity,
                    startTime: startTime,
                    endTime: endTime,
                    posterId: adminUser.id,
                    posterName: adminUser.name,
                    joined: [{ id: adminUser.id, name: adminUser.name }],
                    createdAt: Date.now()
                };

                firebase.database().ref('activities/' + activityId).set(activity)
                    .then(() => {
                        setNewActivity({
                            category: 'sport',
                            title: '',
                            location: '',
                            date: '',
                            startHour: '07',
                            startMinute: '00',
                            startAmPm: 'AM',
                            endHour: '08',
                            endMinute: '00',
                            endAmPm: 'AM',
                            spots: 4,
                            description: ''
                        });
                        setFormSuccess('Activity created successfully!');
                        setTimeout(() => setFormSuccess(''), 3000);
                        setShowCreateModal(false);

                        // Send notifications to students
                        firebase.database().ref('users').once('value').then(snapshot => {
                            const data = snapshot.val() || {};
                            Object.entries(data).forEach(([uid, u]) => {
                                if (u.role === 'student' && uid !== adminUser.id) {
                                    const notifId = 'n_' + Date.now() + '_' + Math.random().toString(36).slice(2);
                                    const notif = {
                                        id: notifId,
                                        userId: uid,
                                        postId: activity.id,
                                        type: 'new_activity',
                                        message: `📢 New Activity: "${activity.title}". Tap here to view the details.`,
                                        read: false,
                                        createdAt: Date.now()
                                    };
                                    firebase.database().ref('notifications/' + notifId).set(notif);
                                }
                            });
                        });
                    })
                    .catch(err => {
                        console.error('Failed to create activity:', err);
                        setFormError('Failed to create activity: ' + err.message);
                    });
            };

            // ========== FIXED: handleCreateStudent ==========
            const handleCreateStudent = async () => {
                setFormError('');
                setFormSuccess('');

                const adminUser = JSON.parse(localStorage.getItem('ing_user') || 'null');
                if (!adminUser || adminUser.type !== 'admin') {
                    setFormError('You are not logged in as an admin. Please log out and log back in.');
                    return;
                }

                if (!newStudent.name || !newStudent.email || !newStudent.password) {
                    setFormError('Please fill in all required fields.');
                    return;
                }
                if (newStudent.password.length < 8) {
                    setFormError('Password must be at least 8 characters long.');
                    return;
                }

                try {
                    const secondaryApp = firebase.initializeApp(firebaseConfig, "Secondary_" + Date.now());
                    const secondaryAuth = secondaryApp.auth();

                    const userCred = await secondaryAuth.createUserWithEmailAndPassword(newStudent.email, newStudent.password);
                    const newUid = userCred.user.uid;

                    const student = {
                        id: newUid,
                        name: newStudent.name,
                        email: newStudent.email,
                        role: 'student',
                        studentId: newStudent.studentId || 'STU' + String(Date.now()).slice(-6),
                        phone: newStudent.phone || '',
                        dob: newStudent.dob || '',
                        course: newStudent.course || '',
                        semester: newStudent.semester || '',
                        createdAt: new Date().toISOString().split('T')[0]
                    };

                    await firebase.database().ref('users/' + newUid).set(student);
                    await secondaryAuth.signOut();
                    await secondaryApp.delete();

                    setStudents([...students, student]);
                    setNewStudent({ name: '', studentId: '', email: '', phone: '', dob: '', course: '', semester: '', password: '' });
                    setFormSuccess('Student account created successfully!');
                    setTimeout(() => setFormSuccess(''), 3000);
                    setShowCreateStudent(false);

                } catch (err) {
                    console.error(err);
                    setFormError(err.message);
                }
            };

            const handleEditStudent = (student) => {
                setEditingStudent({ ...student });
                setShowEditModal(true);
            };

            const saveEditStudent = () => {
                if (!editingStudent.name || !editingStudent.email) {
                    setFormError('Name and email are required.');
                    return;
                }
                firebase.database().ref('users/' + editingStudent.id).update({
                    name: editingStudent.name,
                    email: editingStudent.email,
                    phone: editingStudent.phone || '',
                    course: editingStudent.course || '',
                    semester: editingStudent.semester || ''
                }).then(() => {
                    setStudents(students.map(s => s.id === editingStudent.id ? { ...editingStudent } : s));
                    setShowEditModal(false);
                    setEditingStudent(null);
                    setFormSuccess('Student updated successfully!');
                    setTimeout(() => setFormSuccess(''), 3000);
                }).catch(err => {
                    console.error(err);
                    setFormError(err.message);
                });
            };

            const handleDeleteStudent = (studentId) => {
                firebase.database().ref('users/' + studentId).remove().then(() => {
                    setStudents(students.filter(s => s.id !== studentId));
                    setShowDeleteConfirm(null);
                    setFormSuccess('Student profile removed. Note: their login account still exists in Firebase Authentication and must be deleted separately from Firebase Console if needed.');
                    setTimeout(() => setFormSuccess(''), 5000);
                }).catch(err => {
                    console.error(err);
                    alert('Failed to delete: ' + err.message);
                });
            };

            const resetStudentPassword = (studentId) => {
                const student = students.find(s => s.id === studentId);
                if (!student) return;
                firebase.auth().sendPasswordResetEmail(student.email).then(() => {
                    setFormSuccess(`Password reset email sent to ${student.email}.`);
                    setTimeout(() => setFormSuccess(''), 4000);
                }).catch(err => {
                    console.error(err);
                    alert('Failed to send reset email: ' + err.message);
                });
            };

            const resetAllData = () => {
                if (confirm('⚠️ WARNING: This will delete ALL data. Are you sure?')) {
                    if (confirm('This action CANNOT be undone. Delete everything?')) {
                        localStorage.clear();
                        alert('All data cleared.');
                        window.location.href = '../index.html';
                    }
                }
            };

            // ========== FIXED: getStatusBadge ==========
            const getStatusBadge = (activity) => {
                const eventDate = parseEventDateTime(activity.date, activity.startTime);
                const now = new Date();
                if (eventDate < now) return 'Past';
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                const postDate = new Date(activity.date);
                postDate.setHours(0, 0, 0, 0);
                if (postDate.getTime() === today.getTime()) return 'Today';
                return 'Upcoming';
            };

            const getStatusClass = (status) => {
                const classes = {
                    'Live': 'bg-green-500 text-white',
                    'Today': 'bg-electric-gold text-forest-teal',
                    'Upcoming': 'bg-blue-500 text-white',
                    'Past': 'bg-gray-300 text-gray-600'
                };
                return classes[status] || 'bg-blue-500 text-white';
            };

            const renderDashboard = () => {
                const totalStudents = students.length;
                const totalAdmins = admins.length;
                const totalActivities = allActivities.length;
                const recentActivities = allActivities.slice(0, 6);

                return (
                    <div className="fade-in">
                        <div className="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
                            <div className="bg-white rounded-2xl p-6 shadow-sm card-hover border border-gray-100">
                                <div className="flex items-center gap-3">
                                    <div className="w-12 h-12 bg-blue-50 rounded-xl flex items-center justify-center text-2xl">👨‍🎓</div>
                                    <div>
                                        <p className="text-sm text-gray-500">Total Students</p>
                                        <p className="text-2xl font-bold text-gray-800">{totalStudents}</p>
                                    </div>
                                </div>
                            </div>
                            <div className="bg-white rounded-2xl p-6 shadow-sm card-hover border border-gray-100">
                                <div className="flex items-center gap-3">
                                    <div className="w-12 h-12 bg-purple-50 rounded-xl flex items-center justify-center text-2xl">👔</div>
                                    <div>
                                        <p className="text-sm text-gray-500">Total Admins</p>
                                        <p className="text-2xl font-bold text-gray-800">{totalAdmins}</p>
                                    </div>
                                </div>
                            </div>
                            <div className="bg-white rounded-2xl p-6 shadow-sm card-hover border border-gray-100">
                                <div className="flex items-center gap-3">
                                    <div className="w-12 h-12 bg-yellow-50 rounded-xl flex items-center justify-center text-2xl">📢</div>
                                    <div>
                                        <p className="text-sm text-gray-500">Total Activities</p>
                                        <p className="text-2xl font-bold text-gray-800">{totalActivities}</p>
                                    </div>
                                </div>
                            </div>
                            <div className="bg-white rounded-2xl p-6 shadow-sm card-hover border border-gray-100">
                                <div className="flex items-center gap-3">
                                    <div className="w-12 h-12 bg-red-50 rounded-xl flex items-center justify-center text-2xl">🗑️</div>
                                    <div>
                                        <button onClick={resetAllData} className="btn-danger text-sm px-4 py-2 rounded-full font-bold transition-all duration-300">
                                            Reset All Data
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                            <div className="bg-white rounded-2xl shadow-sm p-6 border border-gray-100 card-hover">
                                <div className="flex items-center gap-3 mb-4">
                                    <div className="w-12 h-12 bg-yellow-50 rounded-xl flex items-center justify-center text-2xl">📝</div>
                                    <div>
                                        <h4 className="font-bold text-gray-800">Create Activity</h4>
                                        <p className="text-sm text-gray-500">Post a new campus activity</p>
                                    </div>
                                </div>
                                <button onClick={() => setShowCreateModal(true)} className="btn-gold w-full py-2 rounded-full font-bold transition-all duration-300 text-center block text-forest-teal">
                                    <i className="fas fa-plus mr-2"></i> New Activity
                                </button>
                            </div>
                            <div className="bg-white rounded-2xl shadow-sm p-6 border border-gray-100 card-hover">
                                <div className="flex items-center gap-3 mb-4">
                                    <div className="w-12 h-12 bg-blue-50 rounded-xl flex items-center justify-center text-2xl">👨‍🎓</div>
                                    <div>
                                        <h4 className="font-bold text-gray-800">Student Management</h4>
                                        <p className="text-sm text-gray-500">Create and manage student accounts</p>
                                    </div>
                                </div>
                                <button onClick={() => setShowCreateStudent(true)} className="btn-forest w-full py-2 rounded-full font-bold transition-all duration-300 text-center block">
                                    <i className="fas fa-user-plus mr-2"></i> Add Student
                                </button>
                            </div>
                        </div>

                        <div className="bg-white rounded-2xl shadow-sm p-6 border border-gray-100">
                            <div className="flex items-center justify-between mb-4">
                                <h3 className="text-xl font-bold text-gray-800">Recent Activities</h3>
                                <button onClick={() => setCurrentPage('activities')} className="text-electric-gold font-semibold hover:underline text-sm">
                                    View All →
                                </button>
                            </div>
                            {recentActivities.length === 0 ? (
                                <div className="text-center py-8 text-gray-400">
                                    <span className="text-4xl block mb-2">📝</span>
                                    <p>No activities posted yet.</p>
                                </div>
                            ) : (
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                    {recentActivities.map(activity => {
                                        const status = getStatusBadge(activity);
                                        const categoryColor = activity.category === 'sport' ? 'tag-sport' : activity.category === 'project' ? 'tag-project' : 'tag-hangout';
                                        return (
                                            <div key={activity.id} className="activity-card bg-gray-50 rounded-xl p-4 border border-gray-100" onClick={() => { setSelectedActivity(activity); setShowActivityDetail(true); }}>
                                                <div className="flex items-start justify-between">
                                                    <span className={`text-xs font-semibold px-2 py-0.5 rounded-full ${categoryColor}`}>{activity.category}</span>

                                        <label className="block text-sm font-medium text-gray-700">Temporary Password * (min 8 chars)</label>
                                        <input type="password" value={newStudent.password} onChange={e => setNewStudent({...newStudent, password: e.target.value})}
                                            className="w-full mt-1 px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#0D5C53] focus:border-transparent transition" />
                                    </div>
                                    <button onClick={handleCreateStudent} className="btn-forest w-full py-3 rounded-xl font-bold transition-all duration-300">
                                        Create Student Account
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {showEditModal && editingStudent && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4" onClick={() => setShowEditModal(false)}>
                            <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl" onClick={e => e.stopPropagation()}>
                                <div className="flex items-center justify-between mb-4">
                                    <h3 className="text-2xl font-bold text-gray-800">Edit Student</h3>
                                    <button onClick={() => setShowEditModal(false)} className="text-gray-400 hover:text-gray-600 text-2xl">&times;</button>
                                </div>
                                <div className="space-y-4">
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700">Full Name</label>
                                        <input type="text" value={editingStudent.name} onChange={e => setEditingStudent({...editingStudent, name: e.target.value})}
                                            className="w-full mt-1 px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#0D5C53] focus:border-transparent transition" />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700">Email</label>
                                        <input type="email" value={editingStudent.email} onChange={e => setEditingStudent({...editingStudent, email: e.target.value})}
                                            className="w-full mt-1 px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#0D5C53] focus:border-transparent transition" />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700">Phone</label>
                                        <input type="text" value={editingStudent.phone || ''} onChange={e => setEditingStudent({...editingStudent, phone: e.target.value})}
                                            className="w-full mt-1 px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#0D5C53] focus:border-transparent transition" />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700">Course/Program</label>
                                        <input type="text" value={editingStudent.course || ''} onChange={e => setEditingStudent({...editingStudent, course: e.target.value})}
                                            className="w-full mt-1 px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#0D5C53] focus:border-transparent transition" />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700">Semester/Year</label>
                                        <input type="text" value={editingStudent.semester || ''} onChange={e => setEditingStudent({...editingStudent, semester: e.target.value})}
                                            className="w-full mt-1 px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#0D5C53] focus:border-transparent transition" />
                                    </div>
                                    <button onClick={saveEditStudent} className="btn-forest w-full py-3 rounded-xl font-bold transition-all duration-300">
                                        Save Changes
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {showDeleteConfirm && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4" onClick={() => setShowDeleteConfirm(null)}>
                            <div className="bg-white rounded-3xl max-w-sm w-full p-8 shadow-2xl" onClick={e => e.stopPropagation()}>
                                <div className="text-center mb-6">
                                    <div className="w-20 h-20 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
                                        <i className="fas fa-exclamation-triangle text-4xl text-red-600"></i>
                                    </div>
                                    <h2 className="text-2xl font-bold text-gray-800">Delete Student</h2>
                                    <p className="text-gray-600 mt-2">Are you sure you want to delete this student account? This action cannot be undone.</p>
                                </div>
                                <div className="flex gap-3">
                                    <button onClick={() => setShowDeleteConfirm(null)} className="flex-1 py-3 border border-gray-200 rounded-xl text-gray-600 hover:bg-gray-50 transition font-medium">Cancel</button>
                                    <button onClick={() => handleDeleteStudent(showDeleteConfirm)} className="flex-1 btn-danger py-3 rounded-xl font-bold transition-all duration-300">Delete</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {showLogoutConfirm && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4" onClick={() => setShowLogoutConfirm(false)}>
                            <div className="bg-white rounded-3xl max-w-sm w-full p-8 shadow-2xl" onClick={e => e.stopPropagation()}>
                                <div className="text-center mb-6">
                                    <div className="w-20 h-20 bg-yellow-100 rounded-full flex items-center justify-center mx-auto mb-4">
                                        <i className="fas fa-sign-out-alt text-4xl text-yellow-600"></i>
                                    </div>
                                    <h2 className="text-2xl font-bold text-gray-800">Log Out?</h2>
                                    <p className="text-gray-600 mt-2">Are you sure you want to log out?</p>
                                </div>
                                <div className="flex gap-3">
                                    <button onClick={() => setShowLogoutConfirm(false)} className="flex-1 py-3 border border-gray-200 rounded-xl text-gray-600 hover:bg-gray-50 transition font-medium">Cancel</button>
                                    <button onClick={() => { localStorage.removeItem('ing_user'); localStorage.removeItem('ing_user_type'); window.location.href = 'admin-login.html'; }} className="flex-1 btn-danger py-3 rounded-xl font-bold transition-all duration-300">Log Out</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>

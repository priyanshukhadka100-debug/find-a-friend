        const convertTo24Hour = (timeStr) => {
            if (!timeStr) return '00:00';
            const match = timeStr.match(/(\d+):(\d+)\s*(AM|PM)/);
            if (!match) return timeStr;
            let hour = parseInt(match[1]);
            const minute = match[2];
            const ampm = match[3];
            if (ampm === 'PM' && hour !== 12) hour += 12;
            if (ampm === 'AM' && hour === 12) hour = 0;
            return `${String(hour).padStart(2, '0')}:${minute}`;
        };

        const parseEventDateTime = (dateStr, timeStr) => {
            const time24 = convertTo24Hour(timeStr || '00:00');
            return new Date(`${dateStr}T${time24}`);

                                                <span className="text-xl font-medium text-gray-500 self-center">:</span>
                                                <select value={newPost.startMinute} onChange={e => setNewPost({...newPost, startMinute: e.target.value})} className="time-select flex-1">
                                                    {['00','05','10','15','20','25','30','35','40','45','50','55'].map(m => (
                                                        <option key={m} value={m}>{m}</option>
                                                    ))}
                                                </select>
                                                <select value={newPost.startAmPm} onChange={e => setNewPost({...newPost, startAmPm: e.target.value})} className="time-select flex-1">
                                                    <option value="AM">AM</option>
                                                    <option value="PM">PM</option>
                                                </select>
                                            </div>
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-1">End Time</label>
                                            <div className="flex gap-1">
                                                <select value={newPost.endHour} onChange={e => setNewPost({...newPost, endHour: e.target.value})} className="time-select flex-1">
                                                    {['07','08','09','10','11','12','01','02','03','04','05','06'].map(h => (
                                                        <option key={h} value={h}>{h}</option>
                                                    ))}
                                                </select>
                                                <span className="text-xl font-medium text-gray-500 self-center">:</span>
                                                <select value={newPost.endMinute} onChange={e => setNewPost({...newPost, endMinute: e.target.value})} className="time-select flex-1">
                                                    {['00','05','10','15','20','25','30','35','40','45','50','55'].map(m => (
                                                        <option key={m} value={m}>{m}</option>
                                                    ))}
                                                </select>
                                                <select value={newPost.endAmPm} onChange={e => setNewPost({...newPost, endAmPm: e.target.value})} className="time-select flex-1">
                                                    <option value="AM">AM</option>
                                                    <option value="PM">PM</option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">Spots</label>
                                        <input type="number" min="2" max="20" value={newPost.spots} onChange={e => setNewPost({...newPost, spots: parseInt(e.target.value) || 4})}
                                            className="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#0D5C53] focus:border-transparent transition" />
                                    </div>
                                    {postError && (
                                        <div className="text-red-600 text-sm bg-red-50 border border-red-200 rounded-xl px-4 py-2">{postError}</div>
                                    )}
                                    <button onClick={addPost} className="btn-forest w-full py-2.5 rounded-xl font-bold transition-all duration-300">
                                        Create Activity
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {showActivityDetail && selectedPost && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4" onClick={() => setShowActivityDetail(false)}>
                            <div className="bg-white rounded-3xl max-w-2xl w-full max-h-[90vh] overflow-y-auto p-6 shadow-2xl" onClick={e => e.stopPropagation()}>
                                <div className="flex items-start justify-between mb-4">
                                    <div>
                                        <span className={`text-xs font-semibold px-3 py-0.5 rounded-full ${selectedPost.category === 'sport' ? 'tag-sport' : selectedPost.category === 'project' ? 'tag-project' : 'tag-hangout'}`}>{selectedPost.category}</span>
                                        <h3 className="text-2xl font-bold text-gray-800 mt-1">{selectedPost.title}</h3>
                                    </div>
                                    <button onClick={() => setShowActivityDetail(false)} className="text-gray-400 hover:text-gray-600 text-2xl">&times;</button>
                                </div>
                                <div className="space-y-4">
                                    <div className="flex flex-wrap gap-4 text-sm text-gray-600 bg-gray-50 p-4 rounded-xl">
                                        <span><i className="fas fa-calendar mr-2"></i>{selectedPost.date}</span>
                                        <span><i className="fas fa-clock mr-2"></i>{formatTimeDisplay(selectedPost.startTime)} - {formatTimeDisplay(selectedPost.endTime)}</span>
                                        <span><i className="fas fa-map-marker-alt mr-2"></i>{selectedPost.location}</span>
                                    </div>
                                    {selectedPost.description && (
                                        <div className="bg-blue-50 p-4 rounded-xl border border-blue-100">
                                            <p className="text-gray-700">{selectedPost.description}</p>
                                        </div>
                                    )}
                                    <div className="flex items-center gap-4">
                                        <span className="text-sm text-gray-600">👥 {selectedPost.joined ? selectedPost.joined.length : 0}/{selectedPost.spots || 4} spots filled</span>
                                        <div className="flex gap-0.5">
                                            {Array.from({ length: Math.min(selectedPost.spots || 4, 10) }, (_, i) => (
                                                <span key={i} className={`w-4 h-4 rounded-full ${i < (selectedPost.joined ? selectedPost.joined.length : 0) ? 'bg-electric-gold' : 'bg-gray-200'}`}></span>
                                            ))}
                                        </div>
                                    </div>
                                    <div className="border-t pt-4">
                                        <h4 className="font-semibold text-gray-700 mb-2">Participants</h4>
                                        <div className="space-y-2">
                                            {selectedPost.joined && selectedPost.joined.length > 0 ? (
                                                selectedPost.joined.map(j => {
                                                    const isCurrentUser = j.id === user.id;
                                                    return (
                                                        <div key={j.id} className="flex items-center justify-between bg-gray-50 p-2 rounded-lg">
                                                            <span className="font-medium">{j.name} {isCurrentUser && <span className="text-xs bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full">You</span>}</span>
                                                            {!isCurrentUser && (
                                                                <button onClick={() => { setShowActivityDetail(false); openChat(j.id, j.name); }} className="btn-forest text-sm px-3 py-1 rounded-full font-medium transition-all duration-300">
                                                                    💬 DM
                                                                </button>
                                                            )}
                                                        </div>
                                                    );
                                                })
                                            ) : (
                                                <div className="text-sm text-gray-400 text-center py-2">No participants yet</div>
                                            )}
                                        </div>
                                    </div>
                                    <div className="flex gap-3 pt-2 flex-wrap">
                                        {/* ***** FIXED: join button condition uses parseEventDateTime ***** */}
                                        {(!selectedPost.joined || !selectedPost.joined.some(j => j.id === user.id)) && 
                                            (selectedPost.joined ? selectedPost.joined.length : 0) < (selectedPost.spots || 4) &&
                                            parseEventDateTime(selectedPost.date, selectedPost.startTime) >= new Date() && (
                                                <button 
                                                    onClick={() => { 
                                                        joinPost(selectedPost.id); 
                                                        setShowActivityDetail(false);
                                                    }} 
                                                    className="btn-forest flex-1 py-3 rounded-xl font-bold transition-all duration-300 min-w-30"
                                                >
                                                    ✅ Join Activity
                                                </button>
                                            )}
                                        {/* ***** FIXED: cancel button uses parseEventDateTime ***** */}
                                        {selectedPost.joined && selectedPost.joined.some(j => j.id === user.id) && 
                                            parseEventDateTime(selectedPost.date, selectedPost.startTime) >= new Date() && (
                                                <button onClick={() => { cancelJoinPost(selectedPost.id); setShowActivityDetail(false); }} className="btn-danger flex-1 py-3 rounded-xl font-bold transition-all duration-300 min-w-30">
                                                    ❌ Cancel Participation
                                                </button>
                                            )}
                                        <button onClick={() => setShowActivityDetail(false)} className="flex-1 border border-gray-200 py-3 rounded-xl text-gray-600 hover:bg-gray-50 transition min-w-20">Close</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {showNotifications && (
                        <div className="fixed inset-0 bg-black/50 backdrop-blur-sm z-40 flex items-center justify-center p-4" onClick={() => setShowNotifications(false)}>
                            <div className="bg-white rounded-3xl max-w-lg w-full max-h-[80vh] shadow-2xl flex flex-col" onClick={e => e.stopPropagation()}>
                                <div className="flex items-center justify-between border-b border-gray-200 px-6 py-4 shrink-0">
                                    <h3 className="font-bold text-xl text-gray-800">🔔 Notifications</h3>
                                    <div className="flex items-center gap-3">
                                        {notifications.filter(n => n.userId === user.id && !n.read).length > 0 && (
                                            <button onClick={markAllNotificationsRead} className="text-sm text-blue-600 hover:text-blue-800 transition">Mark all read</button>
                                        )}
                                        <button onClick={() => setShowNotifications(false)} className="text-gray-400 hover:text-gray-600 text-2xl">&times;</button>
                                    </div>
                                </div>
                                <div className="flex-1 overflow-y-auto p-4 space-y-2">
                                    {(() => {
                                        const userNotifs = notifications.filter(n => n.userId === user.id);
                                        if (userNotifs.length === 0) {
                                            return <div className="text-center py-8 text-gray-500">No notifications</div>;
                                        }
                                        return userNotifs.map(notif => (
                                            <div key={notif.id} className={`notification-item p-3 rounded-xl cursor-pointer ${notif.read ? 'bg-white' : 'unread'}`} onClick={() => handleNotificationClick(notif)}>
                                                <div className="flex items-start gap-3">
                                                    <div className="mt-1">{notif.type === 'new_activity' ? '📢' : '⭐'}</div>
                                                    <div className="flex-1">
                                                        <p className={`text-sm ${notif.read ? 'text-gray-600' : 'text-gray-800 font-medium'}`}>{notif.message}</p>
                                                        <p className="text-xs text-gray-400 mt-1">{new Date(notif.createdAt).toLocaleDateString()}</p>
                                                    </div>
                                                    {!notif.read && <span className="w-2 h-2 bg-blue-500 rounded-full shrink-0 mt-2"></span>}
                                                </div>
                                            </div>
                                        ));
                                    })()}
                                </div>
                            </div>
                        </div>
                    )}

                    {showChatModal && (
                        <div className="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4" onClick={() => setShowChatModal(false)}>
                            <div className="bg-white rounded-3xl chat-modal w-full max-w-7xl h-[85vh] max-h-[85vh] shadow-2xl flex flex-col" onClick={e => e.stopPropagation()}>
                                <div className="flex items-center justify-between border-b border-gray-200 px-6 py-4 shrink-0">
                                    <h3 className="font-bold text-2xl text-gray-800">💬 Messages</h3>
                                    <button onClick={() => { setShowChatModal(false); setChatPartner(null); setSelectedChatId(null); }} className="text-gray-400 hover:text-gray-600 text-3xl">&times;</button>
                                </div>
                                <div className="flex flex-1 overflow-hidden">
                                    <div className="chat-sidebar border-r border-gray-200 flex flex-col bg-gray-50 shrink-0">
                                        <div className="p-4 border-b border-gray-200 bg-white">
                                            <p className="text-sm font-semibold text-gray-700">Your Conversations</p>
                                        </div>
                                        <div className="flex-1 overflow-y-auto chat-list">
                                            {(() => {
                                                const chatList = getUserChats();
                                                if (chatList.length === 0) {
                                                    return <div className="flex flex-col items-center justify-center h-full text-center p-6"><p className="text-gray-500">No messages yet</p></div>;
                                                }
                                                return chatList.map(chat => (
                                                    <div key={chat.key} className={`chat-thread-item px-4 py-3 cursor-pointer flex items-center gap-3 ${selectedChatId === chat.otherId ? 'active' : 'hover:bg-gray-100'}`}
                                                        onClick={() => { setChatPartner({ id: chat.otherId, name: chat.otherName }); setSelectedChatId(chat.otherId); }}>
                                                        <div className={`avatar ${getAvatarColor(chat.otherName)}`}>{chat.otherName.charAt(0).toUpperCase()}</div>
                                                        <div className="flex-1 min-w-0">
                                                            <div className="flex items-center justify-between">
                                                                <p className="font-semibold text-gray-800 truncate">{chat.otherName}</p>
                                                                {chat.isUnread && <span className="w-3 h-3 bg-red-500 rounded-full dm-badge shrink-0"></span>}
                                                            </div>
                                                            <p className="text-sm text-gray-500 truncate">{chat.lastMsg ? chat.lastMsg.text : 'No messages'}</p>
                                                        </div>
                                                    </div>
                                                ));
                                            })()}
                                        </div>
                                    </div>
                                    <div className="chat-main flex flex-col bg-white">
                                        {chatPartner ? (
                                            <>
                                                <div className="flex items-center gap-3 px-6 py-4 border-b border-gray-200 bg-gray-50 shrink-0">
                                                    <div className={`avatar ${getAvatarColor(chatPartner.name)} w-12 h-12 text-lg`}>{chatPartner.name.charAt(0).toUpperCase()}</div>
                                                    <div><p className="font-semibold text-gray-800 text-lg">{chatPartner.name}</p></div>
                                                </div>
                                                <div className="flex-1 overflow-y-auto chat-messages px-6 py-4 space-y-3">
                                                    {(() => {
                                                        const key = [user.id, chatPartner.id].sort().join('|');
                                                        const thread = chatThreads[key] || [];
                                                        if (thread.length === 0) return <div className="flex flex-col items-center justify-center h-full text-center"><p className="text-gray-400">No messages yet</p></div>;
                                                        return thread.map((m, i) => (
                                                            <div key={i} className={`flex ${m.from === user.id ? 'justify-end' : 'justify-start'}`}>
                                                                <div className={`max-w-[70%] px-5 py-3 rounded-2xl text-base ${m.from === user.id ? 'bubble-mine' : 'bubble-theirs'}`}>{m.text}</div>
                                                            </div>
                                                        ));
                                                    })()}
                                                </div>
                                                <div className="border-t border-gray-200 px-4 py-4 bg-gray-50 shrink-0">
                                                    <div className="flex gap-3">
                                                        <input type="text" value={chatMessage} onChange={e => setChatMessage(e.target.value)}
                                                            className="flex-1 px-5 py-3 border border-gray-200 rounded-full focus:ring-2 focus:ring-[#0D5C53] focus:border-transparent transition bg-white text-base"
                                                            placeholder="Type a message..." onKeyDown={e => e.key === 'Enter' && chatMessage.trim() && sendMessage(chatPartner.id, chatMessage)} />
                                                        <button onClick={() => chatMessage.trim() && sendMessage(chatPartner.id, chatMessage)} className="btn-forest px-8 rounded-full font-bold transition-all duration-300 text-white text-base py-3">Send</button>
                                                    </div>
                                                </div>
                                            </>
                                        ) : (
                                            <div className="flex flex-col items-center justify-center h-full text-center p-8">
                                                <div className="text-7xl mb-6">💬</div>
                                                <p className="text-gray-500 font-medium text-2xl">Select a conversation</p>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>

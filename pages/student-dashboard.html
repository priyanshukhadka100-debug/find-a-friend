    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // Structured Predefined Campus Locations
        const CATEGORY_LOCATIONS = {
            sport: [
                { label: '⚽ 10th Floor · Rooftop Futsal Court', value: '10th Floor · Rooftop Futsal Court' },
                { label: '🏀 B2 · Basketball Court', value: 'B2 · Basketball Court' },
                { label: '🏸 B2 · Badminton Court', value: 'B2 · Badminton Court' },
                { label: '🏓 B2 · Table Tennis (TT) Table', value: 'B2 · Table Tennis (TT) Table' },
                { label: '🏏 B2 · Indoor Cricket Area', value: 'B2 · Indoor Cricket Area' },
                { label: '✏️ Custom / Other Location...', value: 'Custom / Other Location...' }
            ],
            hangout: [
                { label: '☕ Ground Floor · Main Cafeteria', value: 'Ground Floor · Main Cafeteria' },
                { label: '弁当 B1 · Lunch Cafeteria', value: 'B1 · Lunch Cafeteria' },
                { label: '🍕 3rd Floor · One More Bite', value: '3rd Floor · One More Bite' },
                { label: '🥤 10th Floor · Mathi Cafe', value: '10th Floor · Mathi Cafe' },
                { label: '✏️ Custom / Other Location...', value: 'Custom / Other Location...' }
            ],
            project: [
                { label: '📚 3rd Floor · Godawari (Library)', value: '3rd Floor · Godawari (Library)' },
                { label: '🚀 1st Floor · IMPACT Lab', value: '1st Floor · IMPACT Lab' },
                { label: '💻 4th Floor · Computer Lab', value: '4th Floor · Computer Lab' },
                { label: '💡 B2 · Entrepreneurs Point', value: 'B2 · Entrepreneurs Point' },
                { label: '🎓 Ground Floor · ING Skill Academy', value: 'Ground Floor · ING Skill Academy' },
                { label: '🎙️ 5th Floor · LT01 (Lecture Hall)', value: '5th Floor · LT01 (Lecture Hall)' },
                { label: '✏️ Custom / Other Location...', value: 'Custom / Other Location...' }
            ]
        };

        // Campus Hours Only (07:00 AM to 06:00 PM)
        const CAMPUS_HOURS = [
            { hour: '07', ampm: 'AM', display: '07:00 AM' },
            { hour: '08', ampm: 'AM', display: '08:00 AM' },
            { hour: '09', ampm: 'AM', display: '09:00 AM' },
            { hour: '10', ampm: 'AM', display: '10:00 AM' },
            { hour: '11', ampm: 'AM', display: '11:00 AM' },
            { hour: '12', ampm: 'PM', display: '12:00 PM (Noon)' },
            { hour: '01', ampm: 'PM', display: '01:00 PM' },
            { hour: '02', ampm: 'PM', display: '02:00 PM' },
            { hour: '03', ampm: 'PM', display: '03:00 PM' },
            { hour: '04', ampm: 'PM', display: '04:00 PM' },
            { hour: '05', ampm: 'PM', display: '05:00 PM' },
            { hour: '06', ampm: 'PM', display: '06:00 PM' },
        ];

        const get24HourVal = (hourStr, ampmStr) => {
            let hour = parseInt(hourStr);
            const ampm = (ampmStr || '').toUpperCase();
            if (ampm === 'PM' && hour !== 12) hour += 12;
            if (ampm === 'AM' && hour === 12) hour = 0;
            return hour;
        };

        const getMinutesFromMidnight = (hourStr, minuteStr, ampmStr) => {
            const h24 = get24HourVal(hourStr, ampmStr);
            return h24 * 60 + parseInt(minuteStr || '0');
        };

        const convertTo24Hour = (timeStr) => {
            if (!timeStr) return '00:00';
            const match = timeStr.match(/(\d+):(\d+)\s*(AM|PM)/i);
            if (!match) return timeStr;
            let hour = parseInt(match[1]);
            const minute = match[2];
            const ampm = match[3].toUpperCase();
            if (ampm === 'PM' && hour !== 12) hour += 12;
            if (ampm === 'AM' && hour === 12) hour = 0;
            return `${String(hour).padStart(2, '0')}:${minute}`;
        };

        const parseEventDateTime = (dateStr, timeStr) => {
            const time24 = convertTo24Hour(timeStr || '00:00');
            return new Date(`${dateStr}T${time24}`);
        };

        const user = JSON.parse(localStorage.getItem('ing_user') || 'null');
        const userType = localStorage.getItem('ing_user_type');

        if (!user || userType !== 'student') {
            window.location.href = 'student-login.html';
        } else {
            firebase.auth().onAuthStateChanged((authUser) => {
                if (!authUser) {
                    localStorage.removeItem('ing_user');
                    localStorage.removeItem('ing_user_type');
                    window.location.href = 'student-login.html';
                }
            });
        }

        const formatTimeDisplay = (timeStr) => {
            if (!timeStr) return '';
            return timeStr;
        };

        const addRipple = (e) => {
            const btn = e.currentTarget;
            const rect = btn.getBoundingClientRect();
            const circle = document.createElement('span');
            const size = Math.max(rect.width, rect.height);
            circle.style.width = circle.style.height = `${size}px`;
            circle.style.left = `${e.clientX - rect.left - size / 2}px`;
            circle.style.top = `${e.clientY - rect.top - size / 2}px`;
            circle.className = 'ripple';
            btn.appendChild(circle);
            setTimeout(() => circle.remove(), 600);
        };

        const Toasts = ({ toasts }) => (
            <div className="toast-wrap">
                {toasts.map(t => (
                    <div key={t.id} className="toast">
                        <div className="font-semibold text-forest-teal text-xs md:text-sm flex items-center gap-2">
                            <i className={`fas ${t.icon || 'fa-circle-check'} text-electric-gold`}></i>
                            {t.title}
                        </div>
                        {t.message && <div className="text-gray-500 text-xs mt-0.5 font-normal">{t.message}</div>}
                    </div>
                ))}
            </div>
        );

        const App = () => {
            const [currentPage, setCurrentPage] = useState('dashboard');
            const [activities, setActivities] = useState([]);
            const [filter, setFilter] = useState('all');
            const [showPostModal, setShowPostModal] = useState(false);
            
            // New Post form state with smart category-based locations & locked campus hours
            const [newPost, setNewPost] = useState({
                category: 'sport',
                title: '',
                location: CATEGORY_LOCATIONS.sport[0].value,
                customLocation: '',
                date: '',
                startHour: '07',
                startMinute: '00',
                startAmPm: 'AM',
                endHour: '08',
                endMinute: '00',
                endAmPm: 'AM',
                spots: 4,
                description: ''
            });

            const [showActivityDetail, setShowActivityDetail] = useState(false);
            const [selectedPost, setSelectedPost] = useState(null);
            
            // Chat & DM state
            const [showChatModal, setShowChatModal] = useState(false);
            const [chatPartner, setChatPartner] = useState(null);
            const [chatMessage, setChatMessage] = useState('');
            const [chatThreads, setChatThreads] = useState({});
            const [usersList, setUsersList] = useState({});
            const [confirmDeleteChat, setConfirmDeleteChat] = useState(null);

            // Profile state
            const [isEditing, setIsEditing] = useState(false);
            const [editForm, setEditForm] = useState({ ...user });
            const [imagePreview, setImagePreview] = useState(user.profileImage || null);
            const [showLogoutConfirm, setShowLogoutConfirm] = useState(false);
            const [showChangePassword, setShowChangePassword] = useState(false);
            const [passwordData, setPasswordData] = useState({ current: '', new: '', confirm: '' });
            const [passwordError, setPasswordError] = useState('');
            const [passwordSuccess, setPasswordSuccess] = useState('');
            const [showPassword, setShowPassword] = useState(false);
            
            // Notifications state
            const [showNotifications, setShowNotifications] = useState(false);
            const [notifications, setNotifications] = useState([]);
            const [unreadNotifications, setUnreadNotifications] = useState(0);
            
            const [selectedChatId, setSelectedChatId] = useState(null);
            const [unreadDMs, setUnreadDMs] = useState(0);
            const [postError, setPostError] = useState('');
            const [toasts, setToasts] = useState([]);

            const pushToast = useCallback((title, message, icon) => {
                const id = Date.now() + Math.random();
                setToasts(t => [...t, { id, title, message, icon }]);
                setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3200);
            }, []);

            const getMyId = () => {
                return (user && (user.id || user.uid)) || (firebase.auth().currentUser && firebase.auth().currentUser.uid) || '';
            };

            const handleStartHourChange = (hour) => {
                const hourObj = CAMPUS_HOURS.find(h => h.hour === hour);
                const autoAmPm = hourObj ? hourObj.ampm : (['01','02','03','04','05','06','12'].includes(hour) ? 'PM' : 'AM');
                
                const currentIndex = CAMPUS_HOURS.findIndex(h => h.hour === hour);
                const nextHourObj = CAMPUS_HOURS[Math.min(currentIndex + 1, CAMPUS_HOURS.length - 1)];

                setNewPost(prev => ({ 
                    ...prev, 
                    startHour: hour, 
                    startAmPm: autoAmPm,
                    endHour: nextHourObj ? nextHourObj.hour : hour,
                    endAmPm: nextHourObj ? nextHourObj.ampm : autoAmPm
                }));
            };

            const handleEndHourChange = (hour) => {
                const hourObj = CAMPUS_HOURS.find(h => h.hour === hour);
                const autoAmPm = hourObj ? hourObj.ampm : (['01','02','03','04','05','06','12'].includes(hour) ? 'PM' : 'AM');
                setNewPost(prev => ({ ...prev, endHour: hour, endAmPm: autoAmPm }));
            };

            const handleCategoryChange = (cat) => {
                const defaultLocObj = CATEGORY_LOCATIONS[cat] ? CATEGORY_LOCATIONS[cat][0] : null;
                setNewPost(prev => ({
                    ...prev,
                    category: cat,
                    location: defaultLocObj ? defaultLocObj.value : '',
                    customLocation: ''
                }));
            };

            // Subscribe to Activities
            useEffect(() => {
                const activitiesRef = firebase.database().ref('activities');
                activitiesRef.on('value', (snapshot) => {
                    const data = snapshot.val() || {};
                    const items = Object.values(data).map(item => ({
                        ...item,
                        joined: Array.isArray(item.joined) ? item.joined : []
                    })).sort((a, b) => b.createdAt - a.createdAt);
                    setActivities(items);
                });

                return () => activitiesRef.off();
            }, []);

            // Subscribe to Users List
            useEffect(() => {
                const usersRef = firebase.database().ref('users');
                usersRef.on('value', snapshot => {
                    setUsersList(snapshot.val() || {});
                });
                return () => usersRef.off();
            }, []);

            // Subscribe to Chats
            useEffect(() => {
                const chatsRef = firebase.database().ref('chats');
                chatsRef.on('value', (snapshot) => {
                    const data = snapshot.val() || {};
                    const threads = {};
                    Object.entries(data).forEach(([key, msgsObj]) => {
                        if (msgsObj && typeof msgsObj === 'object') {
                            const msgList = Object.entries(msgsObj).map(([mId, msgVal]) => ({
                                msgId,
                                ...msgVal
                            })).sort((a, b) => a.at - b.at);
                            threads[key] = msgList;
                        }
                    });
                    setChatThreads(threads);
                });
                return () => chatsRef.off();
            }, []);

            // Subscribe to Notifications - NEWEST FIRST
            useEffect(() => {
                const myId = getMyId();
                if (!myId) return;
                const notifRef = firebase.database().ref('notifications');
                notifRef.on('value', (snapshot) => {
                    const data = snapshot.val() || {};
                    const items = Object.values(data)
                        .filter(n => n.userId === myId)
                        .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                    setNotifications(items);
                });
                return () => notifRef.off();
            }, [user]);

            useEffect(() => {
                const unread = notifications.filter(n => !n.read).length;
                setUnreadNotifications(unread);
            }, [notifications]);

            useEffect(() => {
                let count = 0;
                const myId = getMyId();
                if (!myId) return;
                
                Object.keys(chatThreads).forEach(key => {
                    if (key.includes(myId)) {
                        const thread = chatThreads[key];
                        const lastMsg = thread[thread.length - 1];
                        if (lastMsg && lastMsg.from !== myId) {
                            count++;
                        }
                    }
                });
                setUnreadDMs(count);
            }, [chatThreads, user]);

            const filteredActivities = activities.filter(item => {
                if (filter === 'all') return true;
                return item.category === filter;
            });

            const getAvatarColor = (name) => {
                const safeName = name || 'Unknown';
                const colors = ['avatar-blue','avatar-gold','avatar-green','avatar-purple','avatar-pink','avatar-orange','avatar-red','avatar-teal'];
                let hash = 0;
                for (let i = 0; i < safeName.length; i++) {
                    hash = safeName.charCodeAt(i) + ((hash << 5) - hash);
                }
                return colors[Math.abs(hash) % colors.length];
            };

            const addPost = () => {
                setPostError('');
                
                // Chronological Time Validation
                const startMins = getMinutesFromMidnight(newPost.startHour, newPost.startMinute, newPost.startAmPm);
                const endMins = getMinutesFromMidnight(newPost.endHour, newPost.endMinute, newPost.endAmPm);

                if (endMins <= startMins) {
                    setPostError('End time must be later than start time (e.g., 02:00 PM to 04:00 PM)');
                    return;
                }

                const startTime = `${newPost.startHour}:${newPost.startMinute} ${newPost.startAmPm}`;
                const endTime = `${newPost.endHour}:${newPost.endMinute} ${newPost.endAmPm}`;
                
                const finalLocation = newPost.location === 'Custom / Other Location...' 
                    ? newPost.customLocation.trim() 
                    : newPost.location;

                if (!newPost.title || !finalLocation || !newPost.date) {
                    setPostError('Please fill in all required fields (title, location, date)');
                    return;
                }

                const myId = getMyId();
                if (!myId) {
                    setPostError('You are not signed in properly. Please log out and sign in again.');
                    return;
                }

                const postId = 'p_' + Date.now();
                const post = {
                    id: postId,
                    category: newPost.category,
                    title: newPost.title,
                    location: finalLocation,
                    description: newPost.description,
                    date: newPost.date,
                    startTime: startTime,
                    endTime: endTime,
                    spots: newPost.spots,
                    posterId: myId,
                    posterName: user.name,
                    joined: [{ id: myId, name: user.name }],
                    createdAt: Date.now()
                };

                firebase.database().ref('activities/' + postId).set(post)
                    .then(() => {
                        setShowPostModal(false);
                        pushToast('Activity Created', `"${post.title}" is now live!`, 'fa-calendar-check');
                        setNewPost({
                            category: 'sport',
                            title: '',
                            location: CATEGORY_LOCATIONS.sport[0].value,
                            customLocation: '',
                            date: '',
                            startHour: '07',
                            startMinute: '00',
                            startAmPm: 'AM',
                            endHour: '08',
                            endMinute: '00',
                            endAmPm: 'AM',
                            spots: 4,
                            description: ''
                        });

                        firebase.database().ref('users').once('value').then(snapshot => {
                            const data = snapshot.val() || {};
                            Object.entries(data).forEach(([uid, u]) => {
                                if (uid !== myId) {
                                    const notifId = 'n_' + Date.now() + '_' + Math.random().toString(36).slice(2);
                                    const notif = {
                                        id: notifId,
                                        userId: uid,
                                        postId: postId,
                                        type: 'new_activity',
                                        message: `📢 New Activity: "${post.title}". Tap to view.`,
                                        read: false,
                                        createdAt: Date.now()
                                    };
                                    firebase.database().ref('notifications/' + notifId).set(notif);
                                }
                            });
                        });
                    })
                    .catch(err => {
                        console.error('Failed to post activity:', err);
                        setPostError('Failed to post activity: ' + err.message);
                    });
            };

            const sendMessage = (otherId, text) => {
                const messageText = (text || '').trim();
                if (!messageText || !otherId) return;

                const myId = getMyId();
                if (!myId) {
                    alert("Unable to identify your user ID. Please sign out and log back in.");
                    return;
                }

                const threadKey = [myId, otherId].sort().join('|');
                const msgId = 'm_' + Date.now() + '_' + Math.random().toString(36).slice(2);
                const newMsg = {
                    from: myId,
                    text: messageText,
                    at: Date.now()
                };

                setChatMessage('');

                setChatThreads(prevThreads => {
                    const currentList = prevThreads[threadKey] || [];
                    return {
                        ...prevThreads,
                        [threadKey]: [...currentList, { msgId, ...newMsg }]
                    };
                });

                firebase.database().ref(`chats/${threadKey}/${msgId}`).set(newMsg)
                    .catch(err => {
                        console.error("Direct message send failed:", err);
                        alert("Message could not be sent: " + err.message);
                    });
            };

            const unsendMessage = (threadKey, msgId) => {
                if (confirm('Unsend this message?')) {
                    setChatThreads(prev => {
                        const list = prev[threadKey] || [];
                        return {
                            ...prev,
                            [threadKey]: list.filter(m => m.msgId !== msgId)
                        };
                    });

                    firebase.database().ref(`chats/${threadKey}/${msgId}`).remove()
                        .then(() => pushToast('Message Unsent', null, 'fa-trash-can'))
                        .catch(err => alert('Failed to unsend: ' + err.message));
                }
            };

            // FIX: Guaranteed Working Conversation Delete (Clears local state & Firebase DB node)
            const deleteConversation = (otherId) => {
                const myId = getMyId();
                if (!myId || !otherId) return;

                const primaryKey = [myId, otherId].sort().join('|');

                // 1. Optimistic Local State Removal
                setChatThreads(prev => {
                    const next = { ...prev };
                    delete next[primaryKey];
                    Object.keys(next).forEach(k => {
                        if (k.includes(myId) && k.includes(otherId)) {
                            delete next[k];
                        }
                    });
                    return next;
                });

                setConfirmDeleteChat(null);
                setChatPartner(null);
                setSelectedChatId(null);
                pushToast('Conversation Deleted', 'The chat history has been removed.', 'fa-trash-can');

                // 2. Firebase Database Removal
                firebase.database().ref(`chats/${primaryKey}`).remove()
                    .catch(err => console.error("Firebase chat remove error:", err));

                firebase.database().ref('chats').once('value').then(snapshot => {
                    const data = snapshot.val() || {};
                    Object.keys(data).forEach(k => {
                        if (k.includes(myId) && k.includes(otherId)) {
                            firebase.database().ref(`chats/${k}`).remove().catch(() => {});
                        }
                    });
                });
            };

            const openChat = (otherId, otherName) => {
                setChatPartner({ id: otherId, name: otherName || 'Unknown User' });
                setSelectedChatId(otherId);
                setShowChatModal(true);
            };

            const getUserChats = () => {
                const list = [];
                const myId = getMyId();
                if (!myId) return list;

                Object.keys(chatThreads).forEach(key => {
                    if (key.includes(myId)) {
                        const ids = key.split('|');
                        const otherId = ids[0] === myId ? ids[1] : ids[0];
                        const thread = chatThreads[key];
                        if (thread && thread.length > 0) {
                            const lastMsg = thread[thread.length - 1];
                            const otherUser = usersList[otherId];
                            const otherName = (otherUser && otherUser.name) ? otherUser.name : 'Unknown User';
                            
                            list.push({
                                key,
                                otherId,
                                otherName,
                                lastMsg,
                                isUnread: lastMsg && lastMsg.from !== myId,
                                updatedAt: lastMsg ? lastMsg.at : 0
                            });
                        }
                    }
                });
                return list.sort((a, b) => b.updatedAt - a.updatedAt);
            };

            const joinPost = (postId) => {
                const index = activities.findIndex(p => p.id === postId);
                if (index === -1) return;
                
                const item = activities[index];
                const joinedList = Array.isArray(item.joined) ? item.joined : [];
                const myId = getMyId();
                
                if (joinedList.some(j => j.id === myId)) {
                    alert('You have already joined this activity.');
                    return;
                }
                
                if (joinedList.length >= item.spots) {
                    alert('This activity is full.');
                    return;
                }
                
                const updatedJoined = [...joinedList, { id: myId, name: user.name }];

                firebase.database().ref('activities/' + postId + '/joined').set(updatedJoined)
                    .then(() => {
                        pushToast('Activity Joined!', `You joined "${item.title}"`, 'fa-circle-check');
                    })

            };

                const joinedList = Array.isArray(item.joined) ? item.joined : [];
                const myId = getMyId();
                const updatedJoined = joinedList.filter(j => j.id !== myId);

                firebase.database().ref('activities/' + postId + '/joined').set(updatedJoined)

                if (passwordData.new.length < 8) {

                    return;

                if (passwordData.new !== passwordData.confirm) {
                    setPasswordError('New passwords do not match.');
                    return;
                }
                
                const currentUser = firebase.auth().currentUser;
                if (currentUser) {
                    currentUser.updatePassword(passwordData.new).then(() => {
                        setPasswordSuccess('Password updated successfully in Firebase!');
                        setPasswordError('');
                        setPasswordData({ current: '', new: '', confirm: '' });

                                    >
                                        {cat.charAt(0).toUpperCase() + cat.slice(1)}

                            </div>

                            {filteredActivities.length === 0 ? (

                                                if (chatList.length === 0) {
                                                    return <div className="flex flex-col items-center justify-center h-full text-center p-6 text-gray-400 text-xs font-normal"><p>No messages yet</p></div>;
                                                }
                                                return chatList.map(chat => (
                                                    <div 
                                                        key={chat.key} 
                                                        className={`chat-thread-item px-3.5 py-2.5 cursor-pointer flex items-center gap-2.5 border-b border-gray-100 ${selectedChatId === chat.otherId ? 'active' : ''}`}
                                                        onClick={() => { setChatPartner({ id: chat.otherId, name: chat.otherName }); setSelectedChatId(chat.otherId); }}
                                                    >
                                                        <div className={`avatar ${getAvatarColor(chat.otherName)}`}>{chat.otherName.charAt(0).toUpperCase()}</div>
                                                        <div className="flex-1 min-w-0">
                                                            <div className="flex items-center justify-between">
                                                                <p className="font-semibold text-gray-800 text-xs truncate">{chat.otherName}</p>
                                                                {chat.isUnread && <span className="w-2 h-2 bg-red-500 rounded-full dm-badge shrink-0"></span>}
                                                            </div>
                                                            <p className="text-[11px] text-gray-500 truncate mt-0.5 font-normal">{chat.lastMsg ? chat.lastMsg.text : 'No messages'}</p>
                                                        </div>
                                                    </div>
                                                ));
                                            })()}
                                        </div>
                                    </div>

                                    {/* Active Chat Main Area */}
                                    <div className="chat-main flex flex-col bg-white">
                                        {chatPartner ? (
                                            <>
                                                {/* Active Chat Header */}
                                                <div className="flex items-center justify-between px-5 py-2.5 border-b border-gray-200 bg-gray-50/80 shrink-0">
                                                    <div className="flex items-center gap-2.5">
                                                        <div className={`avatar ${getAvatarColor(chatPartner.name)} w-9 h-9 text-sm`}>{chatPartner.name.charAt(0).toUpperCase()}</div>
                                                        <div>
                                                            <p className="font-semibold text-gray-800 text-sm leading-tight">{chatPartner.name}</p>
                                                            <p className="text-[10px] text-gray-400 font-normal">ING College Student</p>
                                                        </div>
                                                    </div>
                                                    <button 
                                                        onClick={() => setConfirmDeleteChat(chatPartner.id)} 
                                                        className="text-xs font-medium text-red-600 hover:text-red-800 hover:bg-red-50 px-2.5 py-1 rounded-lg border border-red-200 transition flex items-center gap-1"
                                                        title="Delete Conversation"
                                                    >
                                                        <i className="fas fa-trash-can text-[10px]"></i>
                                                        <span className="hidden sm:inline">Delete Chat</span>
                                                    </button>
                                                </div>

                                                {/* Messages Thread */}
                                                <div className="flex-1 overflow-y-auto chat-messages px-5 py-3.5 space-y-2.5">
                                                    {(() => {
                                                        const threadKey = [myId, chatPartner.id].sort().join('|');
                                                        const thread = chatThreads[threadKey] || [];
                                                        if (thread.length === 0) return <div className="flex flex-col items-center justify-center h-full text-center text-gray-400 text-xs font-normal"><p>No messages yet in this conversation</p></div>;
                                                        
                                                        return thread.map((m) => {
                                                            const isMine = m.from === myId;
                                                            return (
                                                                <div key={m.msgId} className={`flex items-end gap-1.5 ${isMine ? 'justify-end' : 'justify-start'}`}>
                                                                    {isMine && (
                                                                        <button 
                                                                            onClick={() => unsendMessage(threadKey, m.msgId)} 
                                                                            className="msg-unsend-btn text-xs text-red-400 hover:text-red-600 p-1 transition"
                                                                            title="Unsend Message"
                                                                        >
                                                                            <i className="fas fa-trash-can text-[11px]"></i>
                                                                        </button>
                                                                    )}
                                                                    <div className={`msg-container max-w-[75%] px-3.5 py-2 rounded-2xl text-xs md:text-sm font-normal ${isMine ? 'bubble-mine' : 'bubble-theirs'}`}>
                                                                        <p>{m.text}</p>
                                                                        <span className="text-[9px] opacity-70 block text-right mt-0.5">
                                                                            {new Date(m.at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
                                                                        </span>
                                                                    </div>
                                                                </div>
                                                            );
                                                        });
                                                    })()}
                                                </div>

                                                {/* Message Input Box */}
                                                <div className="border-t border-gray-200 px-4 py-2.5 bg-gray-50 shrink-0">
                                                    <div className="flex gap-2">
                                                        <input 
                                                            type="text" 
                                                            value={chatMessage} 
                                                            onChange={e => setChatMessage(e.target.value)}
                                                            className="flex-1 px-4 py-2 border border-gray-200 rounded-full focus:ring-2 focus:ring-[#0D5C53] focus:border-transparent transition bg-white text-xs md:text-sm font-normal"
                                                            placeholder="Type a message..." 
                                                            onKeyDown={e => e.key === 'Enter' && sendMessage(chatPartner.id, chatMessage)} 
                                                        />
                                                        <button 
                                                            onClick={() => sendMessage(chatPartner.id, chatMessage)} 
                                                            onMouseDown={addRipple} 
                                                            className="ripple-btn btn-forest px-5 rounded-full font-semibold transition text-white text-xs py-2"
                                                        >
                                                            Send
                                                        </button>
                                                    </div>
                                                </div>
                                            </>
                                        ) : (
                                            <div className="flex flex-col items-center justify-center h-full text-center p-8 text-gray-400">
                                                <div className="text-5xl mb-3">💬</div>
                                                <p className="font-semibold text-gray-700 text-base">Select a conversation</p>
                                                <p className="text-xs mt-0.5 font-normal">Choose a student from the sidebar to chat</p>
                                            </div>
                                        )}
                                    </div>
                                </div>

                                {/* DELETE CONVERSATION OVERLAY DIRECTLY ON TOP OF CHAT MODAL */}
                                {confirmDeleteChat && (
                                    <div className="absolute inset-0 bg-black/60 backdrop-blur-md z-100 flex items-center justify-center p-4 rounded-2xl animate-fade-in" onClick={() => setConfirmDeleteChat(null)}>
                                        <div className="bg-white rounded-2xl max-w-sm w-full p-5 shadow-2xl border border-gray-100 relative z-101" onClick={e => e.stopPropagation()}>
                                            <div className="text-center mb-4">
                                                <div className="w-12 h-12 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-2 text-red-600 text-xl">
                                                    <i className="fas fa-trash-can"></i>
                                                </div>
                                                <h3 className="text-base font-bold text-gray-800">Delete Conversation?</h3>
                                                <p className="text-xs text-gray-500 mt-1 font-normal">This will permanently delete all message history with this student for both participants.</p>
                                            </div>
                                            <div className="flex gap-2.5">
                                                <button onClick={() => setConfirmDeleteChat(null)} className="flex-1 py-2 border border-gray-200 rounded-xl text-gray-600 hover:bg-gray-50 transition text-xs font-medium">Cancel</button>
                                                <button onClick={() => deleteConversation(confirmDeleteChat)} className="flex-1 btn-danger py-2 rounded-xl font-medium text-xs">Delete</button>
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>

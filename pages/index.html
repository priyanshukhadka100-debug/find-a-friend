        const parseEventDateTime = (dateStr, timeStr) => {
            if (!dateStr) return new Date(0);
            if (!timeStr) return new Date(dateStr + 'T00:00:00');
            const match = timeStr.match(/(\d+):(\d+)\s*(AM|PM)/i);
            if (match) {
                let hour = parseInt(match[1]);
                const minute = match[2];
                const ampm = match[3].toUpperCase();
                if (ampm === 'PM' && hour !== 12) hour += 12;
                if (ampm === 'AM' && hour === 12) hour = 0;
                const date = new Date(dateStr);
                if (isNaN(date.getTime())) return new Date(0);
                date.setHours(hour, parseInt(minute), 0, 0);
                return date;
            }
            const d = new Date(dateStr + 'T' + timeStr);
            return isNaN(d.getTime()) ? new Date(0) : d;
        };

        function useReveal() {
            const ref = useRef(null);
            useEffect(() => {
                const el = ref.current;
                if (!el) return;
                const observer = new IntersectionObserver(
                    (entries) => {
                        entries.forEach(entry => {
                            if (entry.isIntersecting) {
                                entry.target.classList.add('in-view');
                                observer.unobserve(entry.target);
                            }
                        });
                    },
                    { threshold: 0.12 }
                );
                observer.observe(el);
                return () => observer.disconnect();
            }, []);
            return ref;
        }

        const Reveal = ({ children, className = '', delay = 0, style = {} }) => {
            const ref = useReveal();
            return (
                <div ref={ref} className={`reveal ${className}`} style={{ ...style, transitionDelay: `${delay}ms` }}>
                    {children}
                </div>
            );
        };

        const CountUp = ({ end, duration = 1400, suffix = '' }) => {
            const [value, setValue] = useState(0);
            const ref = useReveal();
            const started = useRef(false);
            useEffect(() => {
                const el = ref.current;
                if (!el) return;
                const obs = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting && !started.current) {
                            started.current = true;
                            const start = performance.now();
                            const tick = (now) => {
                                const progress = Math.min((now - start) / duration, 1);
                                const eased = 1 - Math.pow(1 - progress, 3);
                                setValue(Math.floor(eased * end));
                                if (progress < 1) requestAnimationFrame(tick);
                                else setValue(end);
                            };
                            requestAnimationFrame(tick);
                        }
                    });
                }, { threshold: 0.3 });
                obs.observe(el);
                return () => obs.disconnect();
            }, [end, duration]);
            return <span ref={ref} className="stat-num">{value}{suffix}</span>;
        };

        const addRipple = (e) => {
            const btn = e.currentTarget;
            const rect = btn.getBoundingClientRect();
            const circle = document.createElement('span');
            const size = Math.max(rect.width, rect.height);
            circle.style.width = circle.style.height = `${size}px`;
            circle.style.left = `${e.clientX - rect.left - size / 2}px`;
            circle.style.top = `${e.clientY - rect.top - size / 2}px`;
            circle.className = 'ripple';
            btn.appendChild(circle);
            setTimeout(() => circle.remove(), 600);
        };

                setToasts(t => [...t, { id, title, message, icon }]);
                setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3200);
            }, []);

            useEffect(() => {
                const checkUser = () => {
                    const savedUser = localStorage.getItem('ing_user');
                    if (savedUser) {
                        try {
                            setUser(JSON.parse(savedUser));
                            setIsLoggedIn(true);
                        } catch(e) {
                            setUser(null);
                            setIsLoggedIn(false);
                        }
                    } else {
                        setUser(null);
                        setIsLoggedIn(false);
                    }
                };

                checkUser();

                const unsubscribe = firebase.auth().onAuthStateChanged((authUser) => {
                    if (authUser) {
                        const savedUser = localStorage.getItem('ing_user');
                        if (savedUser) {
                            try {
                                setUser(JSON.parse(savedUser));
                                setIsLoggedIn(true);
                            } catch (e) {
                                localStorage.removeItem('ing_user');
                                localStorage.removeItem('ing_user_type');
                                setUser(null);
                                setIsLoggedIn(false);
                            }
                        }
                    } else {
                        // Firebase says there's no active session — always clear local
                        // state too, even if a stale ing_user is still sitting in
                        // localStorage, so the UI never shows someone as logged in
                        // when their session has actually expired.
                        localStorage.removeItem('ing_user');
                        localStorage.removeItem('ing_user_type');
                        setUser(null);
                        setIsLoggedIn(false);
                    }
                });

                return () => unsubscribe();
            }, []);

            useEffect(() => {
                localStorage.setItem('recent_searches', JSON.stringify(recentSearches));
            }, [recentSearches]);

            // Fetch REAL activities directly from Firebase Realtime Database
            useEffect(() => {
                if (!isLoggedIn) {
                    setActivities([]);
                    setActivitiesLoaded(true);
                    return;
                }

                const activitiesRef = firebase.database().ref('activities');
                
                const handleSnapshot = (snapshot) => {
                    const data = snapshot.val() || {};
                    let items = [];
                    if (Array.isArray(data)) {
                        items = data.filter(Boolean);
                    } else if (typeof data === 'object') {
                        items = Object.values(data);
                    }

                    items = items.map(item => ({
                        ...item,
                        joined: Array.isArray(item.joined) ? item.joined : []
                    })).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

                    setActivities(items);
                    setActivitiesLoaded(true);
                };

                const handleError = (err) => {
                    console.warn("Firebase activities fetch notice:", err);
                    setActivities([]);
                    setActivitiesLoaded(true);
                };

                activitiesRef.on('value', handleSnapshot, handleError);

                return () => {
                    activitiesRef.off('value', handleSnapshot);
                };
            }, [isLoggedIn]);

            useEffect(() => {
                const onScroll = () => {
                    setScrolled(window.scrollY > 40);
                    setShowBackToTop(window.scrollY > 500);
                };
                window.addEventListener('scroll', onScroll);
                return () => window.removeEventListener('scroll', onScroll);
            }, []);

            const handleSearch = (query) => {
                setActiveIndex(-1);
                if (!query.trim()) {
                    setSearchResults([]);
                    setShowResults(false);
                    return;
                }

                const q = query.toLowerCase();
                const results = FLOOR_SEARCH_DATA.filter(item =>
                    item.name.toLowerCase().includes(q) ||
                    item.floor.toLowerCase().includes(q) ||
                    item.type.toLowerCase().includes(q)
                );

                setSearchResults(results);
                setShowResults(true);

                if (results.length > 0) {
                    const newRecent = [query, ...recentSearches.filter(s => s !== query)].slice(0, 5);
                    setRecentSearches(newRecent);
                }
            };

            const handleResultClick = (result) => {
                const floorMap = {
                    'B2': 'B2', 'B1': 'B1', 'Ground': 'Ground', '1st': '1st',
                    '2nd': '2nd', '3rd': '3rd', '4th': '4th', '5th': '5th',
                    '6th': '6th', '7th': '7th', '8th': '8th', '9th': '9th', '10th': '10th'
                };
                const floor = floorMap[result.floor] || 'Ground';
                window.location.href = `floornavigation.html#${floor}`;
            };

            const handleSearchKeyDown = (e) => {
                if (!showResults || searchResults.length === 0) return;
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    setActiveIndex(i => Math.min(i + 1, searchResults.length - 1));
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    setActiveIndex(i => Math.max(i - 1, 0));
                } else if (e.key === 'Enter' && activeIndex >= 0) {
                    handleResultClick(searchResults[activeIndex]);
                } else if (e.key === 'Escape') {
                    setShowResults(false);
                }
            };

            const clearRecentSearches = () => {

            const handleLogout = () => {

                localStorage.removeItem('ing_user_type');

                setIsLoggedIn(false);

                        <div className="max-w-6xl mx-auto relative z-10">

                                                <a href="student-dashboard.html" className="text-white border border-white/30 px-3 py-1 rounded-full">Dashboard</a>
                                                <button onClick={() => setConfirmOpen(true)} className="text-white/70">Logout</button>
                                            </div>
                                        </div>

                            </div>

                                            {searchResults.length === 0 ? (
                                                <div className="p-6 text-center text-gray-500">
                                                    <i className="fas fa-search text-2xl block text-gray-300 mb-1.5"></i>
                                                    <p className="font-medium text-xs text-gray-700">No facilities found for "{searchQuery}"</p>
                                                </div>
                                            ) : (
                                                <div className="p-2 space-y-1">
                                                    <div className="px-3 py-1 text-[11px] font-medium uppercase tracking-wider text-gray-400 border-b border-gray-100">
                                                        Found {searchResults.length} Match{searchResults.length > 1 ? 'es' : ''}
                                                    </div>
                                                    {searchResults.map((result, index) => (
                                                        <div
                                                            key={index}
                                                            className={`search-result-card p-2.5 rounded-xl border border-transparent flex items-center gap-3 ${index === activeIndex ? 'kbd-active' : ''}`}
                                                            onClick={() => handleResultClick(result)}
                                                            onMouseEnter={() => setActiveIndex(index)}
                                                        >
                                                            <div className="w-8 h-8 rounded-lg bg-forest-teal/10 flex items-center justify-center text-forest-teal text-xs font-semibold shrink-0">
                                                                <i className={`fas ${result.icon || 'fa-building'}`}></i>
                                                            </div>
                                                            <div className="flex-1 text-left min-w-0">
                                                                <div className="font-semibold text-gray-800 text-xs md:text-sm truncate">{result.name}</div>
                                                                <div className="text-xs text-gray-500 flex items-center gap-1.5 mt-0.5 font-normal">
                                                                    <span className="font-medium text-forest-teal bg-teal-50 px-1.5 py-0.5 rounded text-[10px]">{result.floor} Floor</span>
                                                                    <span>•</span>
                                                                    <span>{result.type}</span>
                                                                </div>
                                                            </div>
                                                            <i className="fas fa-arrow-right text-gray-300 text-xs"></i>
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    )}

                                    {/* RECENT SEARCHES */}
                                    {recentSearches.length > 0 && !searchQuery && (
                                        <div className="mt-3 text-left">
                                            <div className="flex items-center justify-between mb-1.5 px-1">

                                                <button onClick={clearRecentSearches} className="text-[11px] text-blue-300 hover:text-white transition">Clear All</button>
                                            </div>
                                            <div className="flex flex-wrap gap-1.5">
                                                {recentSearches.map((search, index) => (
                                                    <button
                                                        key={index}
                                                        onClick={() => { setSearchQuery(search); handleSearch(search); }}
                                                        className="px-3 py-1 bg-white/10 hover:bg-white/20 border border-white/20 rounded-full text-xs text-white transition flex items-center gap-1"
                                                    >
                                                        <i className="fas fa-history text-electric-gold text-[10px]"></i> {search}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    )}

                                    {/* POPULAR SEARCH SUGGESTIONS */}
                                    {recentSearches.length === 0 && !searchQuery && (
                                        <div className="mt-3 flex flex-wrap justify-center items-center gap-1.5">
                                            <span className="text-xs text-blue-200 font-normal mr-1">Popular:</span>
                                            {popularSearches.map((s, i) => (

                                                    key={i}
                                                    onClick={() => { setSearchQuery(s); handleSearch(s); }}
                                                    className="px-2.5 py-0.5 bg-white/10 hover:bg-white/20 border border-white/15 rounded-full text-xs text-blue-100 transition font-normal"
                                                >
                                                    {s}
                                                </button>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            </Reveal>

                            {/* LIVE STAT COUNTERS */}
                            <Reveal delay={280} style={{ position: 'relative', zIndex: 10 }}>
                                <div className="grid grid-cols-2 md:grid-cols-4 gap-3 max-w-3xl mx-auto mt-10 md:mt-14">
                                    <div className="stat-card py-3 px-3">
                                        <div className="text-xl md:text-2xl font-bold text-electric-gold"><CountUp end={totalFloors} /></div>
                                        <div className="text-xs text-blue-100/90 font-normal mt-0.5">Floors Mapped</div>
                                    </div>
                                    <div className="stat-card py-3 px-3">
                                        <div className="text-xl md:text-2xl font-bold text-electric-gold"><CountUp end={totalFacilities} /></div>
                                        <div className="text-xs text-blue-100/90 font-normal mt-0.5">Total Facilities</div>
                                    </div>
                                    <div className="stat-card py-3 px-3">
                                        <div className="text-xl md:text-2xl font-bold text-electric-gold"><CountUp end={totalClassrooms} /></div>
                                        <div className="text-xs text-blue-100/90 font-normal mt-0.5">Classrooms</div>

                                    <div className="flex flex-wrap justify-center gap-2.5">

        .card-hover { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .card-hover:hover { transform: translateY(-6px); box-shadow: 0 20px 40px -12px rgba(0,0,0,0.15); }

        .floor-btn { transition: all 0.3s; position: relative; overflow: hidden; }
        .floor-btn:hover { transform: scale(1.05); background: #FFC700; color: #0D5C53; }
        .floor-btn.active { background: #FFC700; color: #0D5C53; transform: scale(1.05); box-shadow: 0 4px 15px rgba(255, 199, 0, 0.3); }
        .floor-btn.all-btn { background: #0D5C53; color: white; }
        .floor-btn.all-btn:hover { background: #FFC700; color: #0D5C53; }
        .floor-btn.all-btn.active { background: #FFC700; color: #0D5C53; transform: scale(1.05); box-shadow: 0 4px 15px rgba(255, 199, 0, 0.3); }
        .floor-indicator { height: 4px; border-radius: 2px; background: linear-gradient(90deg, #FFC700, #FFC700); transition: width 0.5s; }
        .facility-icon { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; }
        .bg-facility-sport { background: #dbeafe; color: #1a4a7a; }
        .bg-facility-food { background: #fef3c7; color: #92400e; }
        .bg-facility-office { background: #ede9fe; color: #5b21b6; }
        .bg-facility-lab { background: #d1fae5; color: #065f46; }
        .bg-facility-parking { background: #e2e8f0; color: #1e293b; }
        .bg-facility-library { background: #fce7f3; color: #9d174d; }
        .bg-facility-lecture { background: #fef3c7; color: #92400e; }
        .bg-facility-medical { background: #fee2e2; color: #991b1b; }
        .footer__cta { background: linear-gradient(135deg, #0D5C53 0%, #1a7a6e 50%, #2a9a8a 100%); padding: 30px 0; position: relative; overflow: hidden; }
        .art__animation { position: absolute; right: 0; bottom: 0; opacity: 0.1; }
        .glass-effect { background: rgba(255,255,255,0.12); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.15); }

        /* ---------- Media tabs (Floor Plan / 360 Tour) ---------- */
        .media-tab { padding: 8px 16px; border-radius: 999px; font-size: 13px; font-weight: 600; transition: all 0.2s; cursor: pointer; border: 1px solid transparent; }
        .media-tab.active { background: #0D5C53; color: white; }
        .media-tab.inactive { background: #f1f4f2; color: #6b7280; }
        .media-tab.locked { background: #f1f4f2; color: #9ca3af; cursor: not-allowed; }
        .media-tab.locked:hover { background: #f1f4f2; }
        .soon-pill { background: #FFC700; color: #0D5C53; font-size: 9px; padding: 1px 6px; border-radius: 999px; font-weight: 700; margin-left: 6px; vertical-align: middle; }

        .plan-frame { position: relative; border-radius: 20px; overflow: hidden; box-shadow: 0 10px 40px -10px rgba(0,0,0,0.2); background: white; }
        .plan-frame img { cursor: zoom-in; transition: transform 0.4s ease; }
        .plan-skeleton { background: linear-gradient(90deg, #eef1ef 25%, #e3e8e5 37%, #eef1ef 63%); background-size: 400% 100%; animation: skeletonShine 1.4s ease infinite; }
        @keyframes skeletonShine { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }

        .no-media-box { border: 2px dashed #d1d5db; border-radius: 20px; padding: 48px 24px; text-align: center; background: white; }

        /* ---------- Lightbox ---------- */
        .lightbox-backdrop { position: fixed; inset: 0; background: rgba(6,17,17,0.92); z-index: 400; display: flex; align-items: center; justify-content: center; animation: fadeUp 0.2s ease; padding: 24px; }
        .lightbox-close { position: absolute; top: 20px; right: 24px; color: white; font-size: 28px; cursor: pointer; z-index: 401; }
        .lightbox-img { max-width: 100%; max-height: 88vh; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }

        /* ---------- 360 viewer placeholder ---------- */
        .panorama-shell { border-radius: 20px; overflow: hidden; box-shadow: 0 10px 40px -10px rgba(0,0,0,0.2); height: 420px; }

        /* ---------- Toast ---------- */
        .toast-wrap { position: fixed; top: 20px; right: 20px; z-index: 500; display: flex; flex-direction: column; gap: 10px; }

        @keyframes toastIn { from { opacity:0; transform: translateX(30px); } to { opacity:1; transform: translateX(0); } }
    </style>
</head>

        /* =========================================================================
           360° TOUR CONFIG — currently empty on purpose.

           Your 360° photos are still being shot/prepared. Once a floor's panorama
           is ready, just add an entry here:

               '2nd': "https://your-image-host.com/2nd-floor-360.jpg"

           and that floor's "360° Tour" tab will automatically unlock and show the

           clickable arrows) are also possible later — ask for that upgrade when
           you have the images.
           ========================================================================= */

            // '2nd': "https://example.com/path-to-2nd-floor-360.jpg",
        };

        // Floor plan images — filled in for the floors you've provided so far.
        const FLOOR_PLANS = {
            'B2': {

            },

            const floorKeys = ['B2', 'B1', 'Ground', '1st', '2nd', '3rd', '4th', '5th', '6th', '7th', '8th', '9th', '10th'];
            const floorLabels = {
                'B2': 'B2', 'B1': 'B1', 'Ground': 'Ground', '1st': '1st',
                '2nd': '2nd', '3rd': '3rd', '4th': '4th', '5th': '5th',
                '6th': '6th', '7th': '7th', '8th': '8th', '9th': '9th', '10th': '10th'
            };

            floorKeys.forEach(floor => {
                const floorData = FLOOR_DATA_RAW[floor];
                if (floorData && floorData.rooms) {
                    floorData.rooms.forEach(room => {
                        allRooms.push({
                            ...room,
                            id: room.id + '_' + floor,
                            floor: floorLabels[floor]
                        });
                    });
                }
            });
            return allRooms;
        };

        const FLOOR_ORDER = ['All', 'B2', 'B1', 'Ground', '1st', '2nd', '3rd', '4th', '5th', '6th', '7th', '8th', '9th', '10th'];

        // ---------- Toast system ----------

            const [tab, setTab] = useState('plan');
            const [imgLoaded, setImgLoaded] = useState(false);
            const [lightbox, setLightbox] = useState(false);
            const panoramaRef = useRef(null);

            const panoramaUrl = PANORAMA_360[floor];

            useEffect(() => {
                setTab('plan');
                setImgLoaded(false);
            }, [floor]);

            useEffect(() => {
                if (tab === '360' && panoramaUrl && panoramaRef.current) {
                    const viewer = pannellum.viewer(panoramaRef.current, {
                        type: 'equirectangular',
                        panorama: panoramaUrl,
                        autoLoad: true,
                        compass: false,
                    });
                    return () => viewer.destroy();
                }
            }, [tab, panoramaUrl]);

            return (
                <div className="my-6 fade-in">
                    <div className="flex items-center gap-2 mb-3">
                        <button
                            className={`media-tab ${tab === 'plan' ? 'active' : 'inactive'}`}

                        </button>

                            {!panoramaUrl && <span className="soon-pill">SOON</span>}
                        </button>
                    </div>

                    {tab === 'plan' && plan && (
                        <div className="plan-frame">
                            {!imgLoaded && <div className="plan-skeleton w-full" style={{ height: 420 }}></div>}

                                onLoad={() => setImgLoaded(true)}
                                onClick={() => setLightbox(true)}
                                className={`w-full max-h-[80vh] object-contain ${imgLoaded ? '' : 'hidden'}`}
                            />
                        </div>
                    )}

                        <div className="no-media-box">

                                We're still preparing the layout diagram for the {floor} floor. The room directory below is already accurate — check back here for the visual map.
                            </p>
                        </div>
                    )}

                    {tab === 'plan' && plan && imgLoaded && (
                        <p className="text-sm text-gray-500 mt-2 text-center">
                            {plan.caption} <span className="text-gray-300">·</span> <span className="text-forest-teal cursor-pointer" onClick={() => setLightbox(true)}>Click to zoom <i className="fas fa-magnifying-glass-plus"></i></span>
                        </p>
                    )}

                    {tab === '360' && panoramaUrl && (
                        <div ref={panoramaRef} className="panorama-shell"></div>
                    )}

                    {lightbox && (
                        <div className="lightbox-backdrop" onClick={() => setLightbox(false)}>
                            <span className="lightbox-close" onClick={() => setLightbox(false)}>
                                <i className="fas fa-xmark"></i>
                            </span>
                            <img src={plan.url} alt={`${floor} floor plan enlarged`} className="lightbox-img" onClick={(e) => e.stopPropagation()} />
                        </div>
                    )}

        const FloorNavigationApp = () => {
            const [selectedFloor, setSelectedFloor] = useState('All');
            const [searchQuery, setSearchQuery] = useState('');
            const [toasts, setToasts] = useState([]);

            const pushToast = (title, message, icon) => {
                const id = Date.now() + Math.random();
                setToasts(t => [...t, { id, title, message, icon }]);
                setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3200);
            };

            const getCurrentFloorData = () => {
                if (selectedFloor === 'All') {
                    return {
                        label: '🏛️ All Floors',
                        theme: 'Complete Campus Directory',
                        rooms: getAllRooms()
                    };
                }
                return FLOOR_DATA_RAW[selectedFloor] || { label: selectedFloor, theme: '', rooms: [] };
            };

            const currentFloorData = getCurrentFloorData();
            const currentRooms = currentFloorData.rooms || [];
            const floorIndex = FLOOR_ORDER.indexOf(selectedFloor);

            const filteredRooms = useMemo(() => {
                if (!searchQuery.trim()) return currentRooms;
                const q = searchQuery.toLowerCase();
                return currentRooms.filter(r =>
                    r.name.toLowerCase().includes(q) ||
                    r.type.toLowerCase().includes(q) ||
                    (r.floor && r.floor.toLowerCase().includes(q))
                );
            }, [currentRooms, searchQuery]);

            const goToFloor = (floor) => {
                if (FLOOR_ORDER.includes(floor)) {
                    setSelectedFloor(floor);
                    setSearchQuery('');
                }
            };

            const nextFloor = () => {
                if (floorIndex < FLOOR_ORDER.length - 1) {
                    setSelectedFloor(FLOOR_ORDER[floorIndex + 1]);
                    setSearchQuery('');
                }
            };

            const prevFloor = () => {
                if (floorIndex > 0) {
                    setSelectedFloor(FLOOR_ORDER[floorIndex - 1]);
                    setSearchQuery('');
                }
            };

            const getIconBg = (type) => {
                const map = {
                    'Classroom': 'bg-facility-sport',
                    'Sports': 'bg-facility-sport',
                    'Food': 'bg-facility-food',
                    'Office': 'bg-facility-office',
                    'Lab': 'bg-facility-lab',
                    'Parking': 'bg-facility-parking',
                    'Library': 'bg-facility-library',
                    'Lecture': 'bg-facility-lecture',
                    'Medical': 'bg-facility-medical',
                };
                return map[type] || 'bg-facility-office';
            };

            const totalRooms = Object.values(FLOOR_DATA_RAW).reduce((acc, f) => acc + (f.rooms?.length || 0), 0);
            const totalFloors = Object.keys(FLOOR_DATA_RAW).length;

            return (
                <div className="min-h-screen bg-[#F0F4F1]">
                    <Toasts toasts={toasts} />

                    <header className="bg-forest-teal text-white sticky top-0 z-20 shadow-lg">
                        <div className="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 rounded-xl flex items-center justify-center" style={{ background: 'transparent !important' }}>
                                    <img src="https://ing.edu.np/images/footer/logo-new.svg" alt="ING" className="h-15 w-auto" />
                                </div>
                                <div>
                                    <h1 className="text-xl font-bold">🏛️ Floor Navigation</h1>
                                    <p className="text-xs text-blue-200">ING College · {totalFloors} Floors</p>
                                </div>
                            </div>
                            <div className="flex items-center gap-3">
                                <a href="../index.html" className="text-sm text-white/70 hover:text-white px-3 py-1.5 border border-white/20 rounded-full transition hover:bg-white/10">
                                    <i className="fas fa-home mr-1"></i> Home
                                </a>
                                <a href="student-dashboard.html" className="text-sm text-white/70 hover:text-white px-3 py-1.5 border border-white/20 rounded-full transition hover:bg-white/10">
                                    <i className="fas fa-arrow-left mr-1"></i> Dashboard
                                </a>
                            </div>
                        </div>
                    </header>

                    <div className="max-w-7xl mx-auto px-4 py-6">
                        <div className="bg-white rounded-2xl shadow-sm p-4 border border-gray-100 mb-6 slide-in">
                            <div className="flex items-center justify-between mb-3">
                                <div className="flex items-center gap-3">
                                    <span className="text-sm font-medium text-gray-500">Select Floor:</span>
                                    <span className="text-sm font-bold text-electric-gold">{currentFloorData.label}</span>
                                    {selectedFloor === 'All' && (
                                        <span className="text-xs bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full">
                                            {currentRooms.length} rooms total
                                        </span>
                                    )}
                                </div>
                                <div className="flex gap-2">
                                    <button onClick={prevFloor} className="px-3 py-1.5 border border-gray-200 rounded-lg hover:bg-gray-50 transition text-sm disabled:opacity-50 disabled:cursor-not-allowed" disabled={floorIndex <= 0}>
                                        <i className="fas fa-chevron-left"></i> Prev
                                    </button>
                                    <button onClick={nextFloor} className="px-3 py-1.5 border border-gray-200 rounded-lg hover:bg-gray-50 transition text-sm disabled:opacity-50 disabled:cursor-not-allowed" disabled={floorIndex >= FLOOR_ORDER.length - 1}>
                                        Next <i className="fas fa-chevron-right"></i>
                                    </button>
                                </div>
                            </div>
                            <div className="flex flex-wrap gap-1.5 max-h-32 overflow-y-auto">
                                {FLOOR_ORDER.map(floor => (
                                    <button
                                        key={floor}
                                        onClick={() => goToFloor(floor)}
                                        className={`floor-btn px-3 py-1.5 rounded-lg text-xs font-medium transition-all duration-300 ${selectedFloor === floor ? 'active' : floor === 'All' ? 'all-btn' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}`}
                                    >
                                        {floor === 'All' ? '🌟 All' : floor}
                                    </button>
                                ))}
                            </div>
                            <div className="floor-indicator mt-2" style={{ width: `${((floorIndex + 1) / FLOOR_ORDER.length) * 100}%` }}></div>
                        </div>

                        <div className="bg-white rounded-2xl shadow-sm p-6 border border-gray-100 mb-6 fade-in">
                            <div className="flex items-center gap-3 mb-2">
                                <div className="w-12 h-12 bg-electric-gold rounded-xl flex items-center justify-center text-2xl shadow-md text-forest-teal">
                                    {selectedFloor === 'All' ? '🏛️' :
                                     selectedFloor === 'Ground' ? '🏢' :
                                     selectedFloor === 'B2' || selectedFloor === 'B1' ? '🚗' :
                                     selectedFloor === '10th' ? '🌅' : '📚'}
                                </div>
                                <div>
                                    <h2 className="text-2xl font-bold text-gray-800">{currentFloorData.label}</h2>
                                    {currentFloorData.theme && (
                                        <p className="text-sm text-electric-gold font-medium">{currentFloorData.theme}</p>
                                    )}
                                    {selectedFloor === 'All' && (
                                        <p className="text-xs text-gray-400">Showing all rooms across {totalFloors} floors</p>
                                    )}
                                </div>
                            </div>
                            <div className="text-sm text-gray-500">
                                <i className="fas fa-door-open mr-1"></i> {filteredRooms.length} rooms/facilities
                                {selectedFloor !== 'All' && ` on ${selectedFloor}`}
                                {searchQuery && filteredRooms.length !== currentRooms.length && (
                                    <span className="ml-2 text-xs text-electric-gold">(filtered from {currentRooms.length})</span>
                                )}
                            </div>
                        </div>

                        <div className="mb-6 slide-in">
                            <div className="relative">
                                <span className="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400">
                                    <i className="fas fa-search"></i>
                                </span>
                                <input
                                    type="text"
                                    placeholder={selectedFloor === 'All' ? "Search all floors for rooms, labs, offices..." : "Search rooms or facilities on this floor..."}
                                    value={searchQuery}
                                    onChange={e => setSearchQuery(e.target.value)}
                                    className="w-full pl-12 pr-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-[#0D5C53] focus:border-transparent transition bg-white shadow-sm"
                                />
                                {searchQuery && (
                                    <button
                                        onClick={() => setSearchQuery('')}
                                        className="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600"
                                    >
                                        <i className="fas fa-times"></i>
                                    </button>
                                )}
                            </div>
                            {selectedFloor === 'All' && searchQuery && (
                                <div className="mt-2 text-sm text-gray-500">
                                    Found {filteredRooms.length} result{filteredRooms.length !== 1 ? 's' : ''}
                                    {filteredRooms.length > 0 && ` across ${new Set(filteredRooms.map(r => r.floor)).size} floor(s)`}
                                </div>
                            )}
                        </div>

                        {selectedFloor !== 'All' && (
                            <FloorMedia
                                floor={selectedFloor}
                                onLocked={() => pushToast('360° Tour coming soon', `We're preparing the panorama for ${selectedFloor}. Floor plan is available now.`, 'fa-street-view')}
                            />
                        )}

                        <div className="fade-in">
                            {filteredRooms.length === 0 ? (
                                <div className="bg-white rounded-2xl p-12 text-center border border-gray-100">
                                    <span className="text-5xl block mb-4">🔍</span>
                                    <h3 className="text-xl font-semibold text-gray-600">No rooms found</h3>
                                    <p className="text-gray-400 mt-1">
                                        {searchQuery ? 'Try a different search term' : 'No rooms added for this floor yet'}
                                    </p>
                                </div>
                            ) : (
                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                                    {filteredRooms.map((room, index) => (
                                        <div
                                            key={room.id}
                                            className={`bg-white rounded-xl p-4 border border-gray-100 room-card card-hover shadow-sm ${room.isNew ? 'new-room' : ''}`}
                                            style={{ animationDelay: `${index * 50}ms` }}
                                        >
                                            <div className="flex items-start gap-3">
                                                <div className={`facility-icon ${getIconBg(room.type)}`}>
                                                    <i className={`fas ${room.icon || 'fa-building'}`}></i>
                                                </div>
                                                <div className="flex-1 min-w-0">
                                                    <h4 className="font-bold text-gray-800 text-sm truncate flex items-center gap-1.5">
                                                        {room.name}

                                                    </h4>
                                                    <div className="flex items-center gap-2 mt-1 flex-wrap">
                                                        <span className="text-xs px-2 py-0.5 rounded-full bg-gray-100 text-gray-600">
                                                            {room.type}
                                                        </span>
                                                        {selectedFloor === 'All' && room.floor && (
                                                            <span className="text-xs px-2 py-0.5 rounded-full bg-blue-50 text-blue-700">
                                                                <i className="fas fa-location-dot mr-1"></i>{room.floor}
                                                            </span>
                                                        )}
                                                        {selectedFloor !== 'All' && (
                                                            <span className="text-xs text-gray-400">
                                                                <i className="fas fa-location-dot mr-1"></i>{selectedFloor}
                                                            </span>
                                                        )}
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>

                        <div className="mt-8 grid grid-cols-2 md:grid-cols-4 gap-4 slide-in">
                            <div className="bg-white rounded-xl p-4 shadow-sm border border-gray-100 text-center card-hover">
                                <div className="text-2xl font-bold text-electric-gold">{totalFloors}</div>
                                <div className="text-sm text-gray-500">Total Floors</div>
                            </div>
                            <div className="bg-white rounded-xl p-4 shadow-sm border border-gray-100 text-center card-hover">
                                <div className="text-2xl font-bold text-electric-gold">{totalRooms}</div>
                                <div className="text-sm text-gray-500">Total Rooms</div>
                            </div>
                            <div className="bg-white rounded-xl p-4 shadow-sm border border-gray-100 text-center card-hover">
                                <div className="text-2xl font-bold text-electric-gold">{filteredRooms.length}</div>
                                <div className="text-sm text-gray-500">Rooms on this {selectedFloor === 'All' ? 'search' : 'floor'}</div>
                            </div>
                            <div className="bg-white rounded-xl p-4 shadow-sm border border-gray-100 text-center card-hover">
                                <div className="text-2xl font-bold text-electric-gold">{selectedFloor === 'All' ? '🔍' : floorIndex + 1}</div>
                                <div className="text-sm text-gray-500">{selectedFloor === 'All' ? 'All Floors' : 'Floor Position'}</div>
                            </div>
                        </div>

                        <div className="mt-6 bg-white rounded-xl p-4 border border-gray-100 slide-in">
                            <h4 className="text-sm font-semibold text-gray-700 mb-2">Room Type Legend</h4>
                            <div className="flex flex-wrap gap-3">
                                <span className="flex items-center gap-1.5 text-xs"><span className="w-3 h-3 rounded-full bg-facility-sport"></span> Classroom/Sports</span>
                                <span className="flex items-center gap-1.5 text-xs"><span className="w-3 h-3 rounded-full bg-facility-food"></span> Food/Cafeteria</span>
                                <span className="flex items-center gap-1.5 text-xs"><span className="w-3 h-3 rounded-full bg-facility-office"></span> Office</span>
                                <span className="flex items-center gap-1.5 text-xs"><span className="w-3 h-3 rounded-full bg-facility-lab"></span> Lab</span>
                                <span className="flex items-center gap-1.5 text-xs"><span className="w-3 h-3 rounded-full bg-facility-parking"></span> Parking</span>
                                <span className="flex items-center gap-1.5 text-xs"><span className="w-3 h-3 rounded-full bg-facility-library"></span> Library</span>
                                <span className="flex items-center gap-1.5 text-xs"><span className="w-3 h-3 rounded-full bg-facility-lecture"></span> Lecture Hall</span>
                                <span className="flex items-center gap-1.5 text-xs"><span className="w-3 h-3 rounded-full bg-facility-medical"></span> Medical</span>
                            </div>
                        </div>
                    </div>

                    <div className="footer__cta mt-8">
                        <div className="art__animation">
                            <img src="https://ing.edu.np/images/art-animation.png" alt="" className="art__animation-img" />
                        </div>
                        <div className="max-w-6xl mx-auto px-4 text-center relative z-10">
                            <p className="text-sm text-blue-300">
                                © 2026 ING College of Innovation and Leadership. All Rights Reserved.
                            </p>
                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<FloorNavigationApp />);
    </script>
</body>
</html>

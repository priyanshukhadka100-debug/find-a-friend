        .toast { background: white; border-left: 4px solid #FFC700; border-radius: 10px; padding: 12px 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.12); min-width: 250px; animation: toastIn 0.3s cubic-bezier(0.16,1,0.3,1); }

            const floorKeys = ['B2', 'B1', 'Ground', '1st', '2nd', '3rd', '4th', '5th', '6th', '7th', '8th', '9th', '10th'];

                '6th': '6th', '7th': '7th', '8th': '8th', '9th': '9th', '10th': '10th'
            };

                const floorData = FLOOR_DATA_RAW[floor];
                if (floorData && floorData.rooms) {
                    floorData.rooms.forEach(room => {
                        allRooms.push({

                            id: room.id + '_' + floor,
                            floor: floorLabels[floor]
                        });
                    });
                }
            });
            return allRooms;

            }, [floor]);

                        panorama: panoramaUrl,
                        autoLoad: true,
                        compass: false,
                    });

                                We are preparing the architectural diagram for floor {floor}. The room directory below is updated &amp; accurate.
                            </p>
                        </div>
                    )}

                    {tab === 'plan' && plan && imgLoaded && (
                        <p className="text-xs text-gray-500 mt-2 text-center flex items-center justify-center gap-2 font-normal">

                            </button>
                        </p>
                    )}

                    {tab === '360' && panoramaUrl && (
                        <div ref={panoramaRef} className="panorama-shell"></div>
                    )}

                    {lightbox && (
                        <div className="lightbox-backdrop" onClick={() => setLightbox(false)}>
                            <span className="lightbox-close" onClick={() => setLightbox(false)}>

            const [searchQuery, setSearchQuery] = useState('');
            const [toasts, setToasts] = useState([]);
            const [showTopBtn, setShowTopBtn] = useState(false);

            useEffect(() => {
                const handleHash = () => {
                    const hash = window.location.hash.replace('#', '');
                    if (hash && FLOOR_ORDER.includes(hash)) {
                        setSelectedFloor(hash);
                    }
                };
                handleHash();
                window.addEventListener('hashchange', handleHash);
                const onScroll = () => setShowTopBtn(window.scrollY > 400);
                window.addEventListener('scroll', onScroll);
                return () => {
                    window.removeEventListener('hashchange', handleHash);
                    window.removeEventListener('scroll', onScroll);
                };
            }, []);

            const pushToast = (title, message, icon) => {
                const id = Date.now() + Math.random();
                setToasts(t => [...t, { id, title, message, icon }]);
                setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3200);
            };

            const getCurrentFloorData = () => {
                if (selectedFloor === 'All') {
                    return {
                        label: '🏛️ All Floors',
                        theme: 'Complete Campus Directory',
                        rooms: getAllRooms()
                    };
                }
                return FLOOR_DATA_RAW[selectedFloor] || { label: selectedFloor, theme: '', rooms: [] };
            };

            const currentFloorData = getCurrentFloorData();
            const currentRooms = currentFloorData.rooms || [];
            const floorIndex = FLOOR_ORDER.indexOf(selectedFloor);

            const filteredRooms = useMemo(() => {
                if (!searchQuery.trim()) return currentRooms;
                const q = searchQuery.toLowerCase();
                return currentRooms.filter(r =>
                    r.name.toLowerCase().includes(q) ||
                    r.type.toLowerCase().includes(q) ||
                    (r.floor && r.floor.toLowerCase().includes(q))
                );
            }, [currentRooms, searchQuery]);

            const goToFloor = (floor) => {
                if (FLOOR_ORDER.includes(floor)) {
                    setSelectedFloor(floor);
                    setSearchQuery('');
                    window.location.hash = floor === 'All' ? '' : floor;
                }
            };

            const nextFloor = () => {
                if (floorIndex < FLOOR_ORDER.length - 1) {
                    goToFloor(FLOOR_ORDER[floorIndex + 1]);
                }
            };

            const prevFloor = () => {
                if (floorIndex > 0) {
                    goToFloor(FLOOR_ORDER[floorIndex - 1]);
                }
            };

            const getIconBg = (type) => {
                const map = {
                    'Classroom': 'bg-facility-sport',
                    'Sports': 'bg-facility-sport',
                    'Food': 'bg-facility-food',
                    'Office': 'bg-facility-office',
                    'Lab': 'bg-facility-lab',
                    'Parking': 'bg-facility-parking',
                    'Library': 'bg-facility-library',
                    'Lecture': 'bg-facility-lecture',
                    'Medical': 'bg-facility-medical',
                };
                return map[type] || 'bg-facility-office';
            };

            const totalRooms = Object.values(FLOOR_DATA_RAW).reduce((acc, f) => acc + (f.rooms?.length || 0), 0);
            const totalFloors = Object.keys(FLOOR_DATA_RAW).length;

            return (
                <div className="min-h-screen bg-[#F0F4F1]">
                    <Toasts toasts={toasts} />

                    <header className="bg-forest-teal text-white sticky top-0 z-30 shadow-md">
                        <div className="max-w-7xl mx-auto px-4 py-3.5 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="w-9 h-9 rounded-xl flex items-center justify-center">
                                    <img src="https://ing.edu.np/images/footer/logo-new.svg" alt="ING" className="h-10 w-auto" />
                                </div>
                                <div>
                                    <h1 className="text-base md:text-lg font-bold tracking-tight">🏛️ Floor Navigation</h1>
                                    <p className="text-[11px] text-blue-200 font-light">ING College · {totalFloors} Floors Mapped</p>
                                </div>
                            </div>
                            <div className="flex items-center gap-2 md:gap-3">
                                <a href="../index.html" className="text-xs text-white/80 hover:text-white px-3 py-1.5 border border-white/20 rounded-full transition hover:bg-white/10 flex items-center gap-1">
                                    <i className="fas fa-home"></i> <span className="hidden sm:inline">Home</span>
                                </a>
                                <a href="student-dashboard.html" className="text-xs text-white/80 hover:text-white px-3 py-1.5 border border-white/20 rounded-full transition hover:bg-white/10 flex items-center gap-1">
                                    <i className="fas fa-arrow-left"></i> <span className="hidden sm:inline">Dashboard</span>
                                </a>
                            </div>
                        </div>
                    </header>

                    <div className="max-w-7xl mx-auto px-4 py-5">
                        {/* FLOOR SELECTOR CONTROLS */}
                        <div className="bg-white rounded-2xl shadow-xs p-3.5 border border-gray-100 mb-5 slide-in">
                            <div className="flex items-center justify-between mb-2.5 flex-wrap gap-2">
                                <div className="flex items-center gap-2">
                                    <span className="text-xs font-semibold text-gray-500">Active Floor:</span>
                                    <span className="text-xs md:text-sm font-semibold text-forest-teal bg-teal-50 px-2.5 py-0.5 rounded-md border border-teal-100">{currentFloorData.label}</span>
                                    {selectedFloor === 'All' && (
                                        <span className="text-[11px] bg-amber-100 text-amber-800 font-medium px-2 py-0.5 rounded-full">
                                            {currentRooms.length} rooms total
                                        </span>
                                    )}
                                </div>
                                <div className="flex gap-1.5">
                                    <button onClick={prevFloor} className="px-2.5 py-1 border border-gray-200 rounded-lg hover:bg-gray-50 transition text-xs font-medium text-gray-700 disabled:opacity-40 disabled:cursor-not-allowed" disabled={floorIndex <= 0}>
                                        <i className="fas fa-chevron-left mr-1 text-[10px]"></i> Prev
                                    </button>
                                    <button onClick={nextFloor} className="px-2.5 py-1 border border-gray-200 rounded-lg hover:bg-gray-50 transition text-xs font-medium text-gray-700 disabled:opacity-40 disabled:cursor-not-allowed" disabled={floorIndex >= FLOOR_ORDER.length - 1}>
                                        Next <i className="fas fa-chevron-right ml-1 text-[10px]"></i>
                                    </button>
                                </div>
                            </div>
                            
                            <div className="flex flex-wrap gap-1.5 max-h-32 overflow-y-auto pt-1 pb-1">
                                {FLOOR_ORDER.map(floor => (
                                    <button
                                        key={floor}
                                        onClick={() => goToFloor(floor)}
                                        className={`floor-btn px-3 py-1 rounded-lg text-xs transition-all ${selectedFloor === floor ? 'active' : floor === 'All' ? 'all-btn' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'}`}
                                    >
                                        {floor === 'All' ? '🌟 All Floors' : floor}
                                    </button>
                                ))}
                            </div>
                            <div className="floor-indicator mt-1.5" style={{ width: `${((floorIndex + 1) / FLOOR_ORDER.length) * 100}%` }}></div>
                        </div>

                        {/* CURRENT FLOOR BANNER */}
                        <div className="bg-white rounded-2xl shadow-xs p-5 border border-gray-100 mb-5 fade-in">
                            <div className="flex items-center gap-3.5 mb-1.5">
                                <div className="w-11 h-11 md:w-12 md:h-12 bg-electric-gold rounded-xl flex items-center justify-center text-xl md:text-2xl shadow-xs text-forest-teal shrink-0">
                                    {selectedFloor === 'All' ? '🏛️' :
                                     selectedFloor === 'Ground' ? '🏢' :
                                     selectedFloor === 'B2' || selectedFloor === 'B1' ? '🚗' :
                                     selectedFloor === '10th' ? '🌅' : '📚'}
                                </div>
                                <div>
                                    <h2 className="text-lg md:text-2xl font-bold text-gray-800 tracking-tight">{currentFloorData.label}</h2>
                                    {currentFloorData.theme && (
                                        <p className="text-xs text-forest-teal font-medium mt-0.5">{currentFloorData.theme}</p>
                                    )}
                                    {selectedFloor === 'All' && (
                                        <p className="text-xs text-gray-400 font-normal">Viewing comprehensive index across all {totalFloors} campus levels</p>
                                    )}
                                </div>
                            </div>
                            <div className="text-xs text-gray-500 mt-2.5 pt-2.5 border-t border-gray-100 flex items-center gap-2 font-normal">
                                <i className="fas fa-door-open text-electric-gold text-xs"></i>
                                <span>{filteredRooms.length} room/facility items listed</span>
                                {searchQuery && filteredRooms.length !== currentRooms.length && (
                                    <span className="text-xs text-forest-teal font-medium">(filtered from {currentRooms.length})</span>
                                )}
                            </div>
                        </div>

                        {/* SEARCH INPUT */}
                        <div className="mb-5 slide-in">
                            <div className="relative">
                                <span className="absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400">
                                    <i className="fas fa-search text-xs"></i>
                                </span>
                                <input
                                    type="text"
                                    placeholder={selectedFloor === 'All' ? "Search all floors for room, lab, cafeteria..." : `Search rooms or facilities on ${selectedFloor} floor...`}
                                    value={searchQuery}
                                    onChange={e => setSearchQuery(e.target.value)}
                                    className="w-full pl-10 pr-9 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-[#0D5C53] focus:border-transparent transition bg-white shadow-xs text-xs md:text-sm font-normal"
                                />
                                {searchQuery && (
                                    <button
                                        onClick={() => setSearchQuery('')}
                                        className="absolute right-3.5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600"
                                    >
                                        <i className="fas fa-times text-xs"></i>
                                    </button>
                                )}
                            </div>
                            {selectedFloor === 'All' && searchQuery && (
                                <div className="mt-1.5 text-xs text-gray-500 pl-1 font-normal">
                                    Found {filteredRooms.length} result{filteredRooms.length !== 1 ? 's' : ''}
                                    {filteredRooms.length > 0 && ` across ${new Set(filteredRooms.map(r => r.floor)).size} floor(s)`}
                                </div>
                            )}
                        </div>

                        {/* MEDIA CONTAINER */}
                        {selectedFloor !== 'All' && (
                            <FloorMedia
                                floor={selectedFloor}
                                onLocked={() => pushToast('360° Tour coming soon', `We're preparing the panorama for ${selectedFloor}. Floor plan is available now.`, 'fa-street-view')}
                            />
                        )}

                        {/* ROOM DIRECTORY GRID */}
                        <div className="fade-in">
                            {filteredRooms.length === 0 ? (
                                <div className="bg-white rounded-2xl p-10 text-center border border-gray-100 shadow-xs">
                                    <span className="text-4xl block mb-2">🔍</span>
                                    <h3 className="text-base font-semibold text-gray-700">No facilities found</h3>
                                    <p className="text-xs text-gray-400 mt-1 font-normal">
                                        {searchQuery ? 'Try adjusting your search criteria' : 'No rooms listed for this floor yet'}
                                    </p>
                                </div>
                            ) : (
                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3.5">
                                    {filteredRooms.map((room, index) => (
                                        <div
                                            key={room.id}
                                            className={`bg-white rounded-xl p-3.5 border border-gray-100 room-card card-hover shadow-xs}`}
                                            style={{ animation: `fadeUp 0.35s ease forwards`, animationDelay: `${Math.min(index * 30, 350)}ms` }}
                                        >
                                            <div className="flex items-start gap-3">
                                                <div className={`facility-icon ${getIconBg(room.type)}`}>
                                                    <i className={`fas ${room.icon || 'fa-building'}`}></i>
                                                </div>
                                                <div className="flex-1 min-w-0">
                                                    <h4 className="font-semibold text-gray-800 text-xs md:text-sm truncate">
                                                        {room.name}
                                                    </h4>
                                                    <div className="flex items-center gap-1.5 mt-1 flex-wrap">
                                                        <span className="text-[11px] px-2 py-0.5 rounded-md bg-gray-100 font-medium text-gray-600">
                                                            {room.type}
                                                        </span>
                                                        {selectedFloor === 'All' && room.floor && (
                                                            <span className="text-[11px] px-2 py-0.5 rounded-md bg-teal-50 text-forest-teal font-semibold">
                                                                <i className="fas fa-location-dot mr-1 text-electric-gold text-[10px]"></i>{room.floor}
                                                            </span>
                                                        )}
                                                        {selectedFloor !== 'All' && (
                                                            <span className="text-[11px] text-gray-400 font-normal">
                                                                <i className="fas fa-location-dot mr-1 text-[10px]"></i>{selectedFloor}
                                                            </span>
                                                        )}
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>

                        {/* STATS OVERVIEW */}
                        <div className="mt-8 grid grid-cols-2 md:grid-cols-4 gap-3 slide-in">
                            <div className="bg-white rounded-xl p-3.5 shadow-xs border border-gray-100 text-center card-hover">
                                <div className="text-xl font-bold text-forest-teal">{totalFloors}</div>
                                <div className="text-xs text-gray-500 font-normal mt-0.5">Total Floors</div>
                            </div>
                            <div className="bg-white rounded-xl p-3.5 shadow-xs border border-gray-100 text-center card-hover">
                                <div className="text-xl font-bold text-forest-teal">{totalRooms}</div>
                                <div className="text-xs text-gray-500 font-normal mt-0.5">Total Facilities</div>
                            </div>
                            <div className="bg-white rounded-xl p-3.5 shadow-xs border border-gray-100 text-center card-hover">
                                <div className="text-xl font-bold text-forest-teal">{filteredRooms.length}</div>
                                <div className="text-xs text-gray-500 font-normal mt-0.5">{selectedFloor === 'All' ? 'Matching Results' : 'Floor Facilities'}</div>
                            </div>
                            <div className="bg-white rounded-xl p-3.5 shadow-xs border border-gray-100 text-center card-hover">
                                <div className="text-xl font-bold text-forest-teal">{selectedFloor === 'All' ? '🌟' : floorIndex}</div>
                                <div className="text-xs text-gray-500 font-normal mt-0.5">{selectedFloor === 'All' ? 'All Selected' : 'Floor Index'}</div>
                            </div>
                        </div>

                        {/* LEGEND */}
                        <div className="mt-5 bg-white rounded-xl p-3.5 border border-gray-100 slide-in">
                            <h4 className="text-[11px] font-semibold text-gray-400 uppercase tracking-wider mb-2">Category Legend</h4>
                            <div className="flex flex-wrap gap-3">
                                <span className="flex items-center gap-1.5 text-xs font-normal text-gray-600"><span className="w-2.5 h-2.5 rounded-full bg-facility-sport"></span> Classroom/Sports</span>
                                <span className="flex items-center gap-1.5 text-xs font-normal text-gray-600"><span className="w-2.5 h-2.5 rounded-full bg-facility-food"></span> Cafeteria/Food</span>
                                <span className="flex items-center gap-1.5 text-xs font-normal text-gray-600"><span className="w-2.5 h-2.5 rounded-full bg-facility-office"></span> Administration/Office</span>
                                <span className="flex items-center gap-1.5 text-xs font-normal text-gray-600"><span className="w-2.5 h-2.5 rounded-full bg-facility-lab"></span> Laboratory</span>
                                <span className="flex items-center gap-1.5 text-xs font-normal text-gray-600"><span className="w-2.5 h-2.5 rounded-full bg-facility-parking"></span> Parking</span>
                                <span className="flex items-center gap-1.5 text-xs font-normal text-gray-600"><span className="w-2.5 h-2.5 rounded-full bg-facility-library"></span> Library</span>
                                <span className="flex items-center gap-1.5 text-xs font-normal text-gray-600"><span className="w-2.5 h-2.5 rounded-full bg-facility-lecture"></span> Lecture Hall</span>
                            </div>
                        </div>
                    </div>

                    {showTopBtn && (
                        <div className="top-btn" onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })} title="Back to Top">
                            <i className="fas fa-arrow-up text-xs"></i>
                        </div>
                    )}

                    <div className="footer__cta mt-10">
                        <div className="art__animation">
                            <img src="https://ing.edu.np/images/art-animation.png" alt="" className="art__animation-img" />
                        </div>
                        <div className="max-w-6xl mx-auto px-4 text-center relative z-10">
                            <p className="text-xs text-blue-200/80 font-normal">
                                © 2026 ING College of Innovation and Leadership. All Rights Reserved.
                            </p>
                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<FloorNavigationApp />);
    </script>
</body>
</htm
